<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>APLIKASI HITUNG SURAT JALAN MANUAL</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    font-family:
        "Segoe UI",
        Inter,
        Arial,
        sans-serif;
}


/* =========================================================
   BODY
========================================================= */

body {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 25px;

    color: #ffffff;

    background:

        radial-gradient(
            circle at 15% 15%,
            rgba(77, 91, 255, .28),
            transparent 28%
        ),

        radial-gradient(
            circle at 85% 80%,
            rgba(138, 43, 226, .25),
            transparent 30%
        ),

        radial-gradient(
            circle at 50% 110%,
            rgba(0, 210, 255, .12),
            transparent 35%
        ),

        #05070d;

    overflow-x: hidden;

    perspective: 1400px;
}


/* =========================================================
   BACKGROUND ORBS
========================================================= */

body::before {

    content: "";

    position: fixed;

    width: 280px;
    height: 280px;

    border-radius: 50%;

    background:
        rgba(99, 102, 241, .12);

    filter: blur(80px);

    top: -100px;
    left: -80px;

    pointer-events: none;
}


body::after {

    content: "";

    position: fixed;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    background:
        rgba(168, 85, 247, .10);

    filter: blur(90px);

    bottom: -130px;
    right: -100px;

    pointer-events: none;
}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container {

    width: 760px;

    max-width: 100%;

    position: relative;

    padding: 28px;

    border-radius: 32px;

    background:

        linear-gradient(
            145deg,
            rgba(31, 37, 55, .97),
            rgba(8, 11, 19, .98)
        );

    border:
        1px solid
        rgba(255,255,255,.10);

    box-shadow:

        0 45px 100px
        rgba(0,0,0,.65),

        0 15px 30px
        rgba(0,0,0,.35),

        inset 0 1px 0
        rgba(255,255,255,.08),

        inset 0 -1px 0
        rgba(0,0,0,.6);

    transform:
        rotateX(.5deg);

    transition:
        transform .35s ease,
        box-shadow .35s ease;
}


.container:hover {

    transform:
        rotateX(0deg)
        translateY(-2px);

    box-shadow:

        0 55px 110px
        rgba(0,0,0,.68),

        0 20px 35px
        rgba(0,0,0,.35),

        inset 0 1px 0
        rgba(255,255,255,.09),

        inset 0 -1px 0
        rgba(0,0,0,.6);
}


/* =========================================================
   TOP LIGHT
========================================================= */

.container::before {

    content: "";

    position: absolute;

    top: 0;
    left: 12%;

    width: 76%;
    height: 2px;

    border-radius: 50%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(129,140,248,.9),
            rgba(192,132,252,.9),
            transparent
        );

    box-shadow:

        0 0 18px
        rgba(129,140,248,.7);
}


/* =========================================================
   HEADER
========================================================= */

.header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 25px;
}


/* =========================================================
   TITLE
========================================================= */

.title {

    display: flex;

    align-items: center;

    gap: 14px;
}


/* =========================================================
   3D ICON
========================================================= */

.icon {

    width: 52px;
    height: 52px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 17px;

    color: white;

    font-size: 23px;

    font-weight: 900;

    background:

        linear-gradient(
            145deg,
            #818cf8,
            #6366f1 45%,
            #4f46e5
        );

    border:
        1px solid
        rgba(255,255,255,.22);

    box-shadow:

        0 12px 0
        #3730a3,

        0 18px 28px
        rgba(79,70,229,.35),

        inset 0 2px 2px
        rgba(255,255,255,.35),

        inset 0 -5px 8px
        rgba(0,0,0,.15);

    text-shadow:
        0 2px 2px
        rgba(0,0,0,.25);

    transform:
        translateY(-3px);
}


.title h1 {

    font-size: 20px;

    font-weight: 800;

    letter-spacing: -.4px;

    color: #f8fafc;

    text-shadow:
        0 2px 10px
        rgba(0,0,0,.35);
}


.title p {

    margin-top: 4px;

    color: #747e92;

    font-size: 12px;
}


/* =========================================================
   3D COUNTER
========================================================= */

.counter {

    display: flex;

    align-items: center;

    gap: 7px;

    padding:
        9px 14px;

    border-radius: 20px;

    background:

        linear-gradient(
            145deg,
            #202738,
            #111621
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    color: #a5b4fc;

    font-size: 11px;

    font-weight: 700;

    box-shadow:

        0 5px 0
        #090c13,

        0 10px 18px
        rgba(0,0,0,.30),

        inset 0 1px 0
        rgba(255,255,255,.07);
}


.counter::before {

    content: "";

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #22c55e;

    box-shadow:
        0 0 10px
        rgba(34,197,94,.9);
}


/* =========================================================
   INPUT LIST
========================================================= */

.input-list {

    max-height: 325px;

    overflow-y: auto;

    padding:
        5px 7px 5px 3px;

    scrollbar-width: thin;

    scrollbar-color:
        #3a4358 transparent;
}


.input-list::-webkit-scrollbar {

    width: 5px;
}


.input-list::-webkit-scrollbar-track {

    background: transparent;
}


.input-list::-webkit-scrollbar-thumb {

    background:
        linear-gradient(
            #454f68,
            #252d3e
        );

    border-radius: 20px;
}


/* =========================================================
   INPUT ROW
========================================================= */

.input-row {

    display: flex;

    align-items: center;

    gap: 12px;

    margin-bottom: 13px;

    animation:
        inputAppear .28s ease;

    transform-style: preserve-3d;
}


@keyframes inputAppear {

    from {

        opacity: 0;

        transform:
            translateY(12px)
            rotateX(-8deg);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            rotateX(0);
    }

}


/* =========================================================
   3D NUMBER
========================================================= */

.number {

    width: 43px;
    height: 52px;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;

    border-radius: 14px;

    background:

        linear-gradient(
            145deg,
            #252d40,
            #151b28
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    color: #7f8ba2;

    font-size: 12px;

    font-weight: 800;

    box-shadow:

        0 5px 0
        #090d15,

        0 9px 16px
        rgba(0,0,0,.30),

        inset 0 1px 0
        rgba(255,255,255,.08);

    transform:
        translateZ(10px);
}


/* =========================================================
   INPUT WRAPPER
========================================================= */

.input-wrapper {

    position: relative;

    flex: 1;
}


/* =========================================================
   INPUT
========================================================= */

input {

    width: 100%;

    height: 52px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 15px;

    background:

        linear-gradient(
            145deg,
            #111722,
            #090d15
        );

    color: #ffffff;

    padding:
        0 50px 0 17px;

    font-size: 16px;

    font-weight: 600;

    outline: none;

    transition:
        .2s;

    box-shadow:

        0 6px 0
        #05070c,

        0 10px 20px
        rgba(0,0,0,.28),

        inset 0 1px 0
        rgba(255,255,255,.04),

        inset 0 -3px 8px
        rgba(0,0,0,.18);
}


input:hover {

    border-color:
        rgba(129,140,248,.25);
}


input:focus {

    border-color:
        #6366f1;

    background:

        linear-gradient(
            145deg,
            #151b2a,
            #0b101b
        );

    box-shadow:

        0 6px 0
        #3730a3,

        0 12px 25px
        rgba(99,102,241,.18),

        0 0 0 3px
        rgba(99,102,241,.10),

        inset 0 1px 0
        rgba(255,255,255,.08);
}


input::placeholder {

    color: #4d586c;
}


/* REMOVE NUMBER ARROWS */

input::-webkit-inner-spin-button,
input::-webkit-outer-spin-button {

    -webkit-appearance: none;

    margin: 0;
}


input[type=number] {

    -moz-appearance: textfield;
}


/* =========================================================
   CHECK
========================================================= */

.check {

    position: absolute;

    right: 15px;

    top: 50%;

    transform:
        translateY(-50%)
        scale(.7);

    width: 22px;
    height: 22px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background:

        linear-gradient(
            145deg,
            #4ade80,
            #16a34a
        );

    border:
        1px solid
        rgba(255,255,255,.15);

    color: white;

    font-size: 11px;

    font-weight: 900;

    opacity: 0;

    transition:
        .2s;

    box-shadow:

        0 3px 0
        #166534,

        0 5px 10px
        rgba(34,197,94,.25);
}


input.valid + .check {

    opacity: 1;

    transform:
        translateY(-50%)
        scale(1);
}


/* =========================================================
   BUTTON AREA
========================================================= */

.button-area {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 12px;

    margin-top: 12px;
}


button {

    height: 52px;

    border: none;

    border-radius: 15px;

    cursor: pointer;

    font-size: 12px;

    font-weight: 800;

    transition:
        transform .15s,
        box-shadow .15s;

    -webkit-tap-highlight-color:
        transparent;
}


button:active {

    transform:
        translateY(4px);
}


/* =========================================================
   ADD BUTTON 3D
========================================================= */

.add-button {

    color: #b9c2d2;

    background:

        linear-gradient(
            145deg,
            #252d3e,
            #151b27
        );

    border:
        1px solid
        rgba(255,255,255,.07);

    box-shadow:

        0 6px 0
        #090d14,

        0 12px 20px
        rgba(0,0,0,.28),

        inset 0 1px 0
        rgba(255,255,255,.07);
}


.add-button:hover {

    color: white;

    background:

        linear-gradient(
            145deg,
            #303a50,
            #1a2130
        );

    transform:
        translateY(-2px);

    box-shadow:

        0 8px 0
        #090d14,

        0 15px 25px
        rgba(0,0,0,.35);
}


/* =========================================================
   SAVE BUTTON 3D
========================================================= */

.save-button {

    color: white;

    background:

        linear-gradient(
            145deg,
            #818cf8,
            #6366f1 45%,
            #7c3aed
        );

    border:
        1px solid
        rgba(255,255,255,.18);

    box-shadow:

        0 6px 0
        #3730a3,

        0 14px 28px
        rgba(99,102,241,.30),

        inset 0 1px 0
        rgba(255,255,255,.30);
}


.save-button:hover {

    transform:
        translateY(-3px);

    box-shadow:

        0 9px 0
        #3730a3,

        0 20px 35px
        rgba(99,102,241,.38),

        inset 0 1px 0
        rgba(255,255,255,.35);
}


/* =========================================================
   TOTAL RESULT
========================================================= */

.result {

    display: none;

    margin-top: 17px;

    padding:
        19px 21px;

    border-radius: 19px;

    position: relative;

    overflow: hidden;

    background:

        linear-gradient(
            145deg,
            rgba(49,46,129,.38),
            rgba(30,27,75,.22)
        );

    border:
        1px solid
        rgba(129,140,248,.22);

    box-shadow:

        0 8px 0
        rgba(30,27,75,.8),

        0 18px 30px
        rgba(0,0,0,.28),

        inset 0 1px 0
        rgba(255,255,255,.08);
}


.result::before {

    content: "";

    position: absolute;

    width: 100px;
    height: 100px;

    border-radius: 50%;

    background:
        rgba(129,140,248,.12);

    filter: blur(25px);

    top: -55px;
    right: -30px;
}


.result.show {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    animation:
        resultAppear .3s ease;
}


@keyframes resultAppear {

    from {

        opacity: 0;

        transform:
            translateY(8px)
            scale(.98);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }

}


.result-label {

    display: flex;

    flex-direction: column;

    gap: 4px;

    position: relative;
}


.result-label span {

    color: #9ba6bd;

    font-size: 10px;

    text-transform:
        uppercase;

    letter-spacing: 1.5px;

    font-weight: 800;
}


.result-label small {

    color: #5c6780;

    font-size: 10px;
}


.result strong {

    position: relative;

    color: #c4b5fd;

    font-size: 29px;

    font-weight: 900;

    letter-spacing: -.8px;

    text-shadow:

        0 3px 10px
        rgba(139,92,246,.25);
}


/* =========================================================
   HISTORY
========================================================= */

.history {

    margin-top: 29px;

    padding-top: 23px;

    border-top:
        1px solid
        rgba(255,255,255,.06);
}


.history-header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 14px;
}


.history-title h2 {

    display: flex;

    align-items: center;

    gap: 9px;

    font-size: 15px;

    font-weight: 800;

    color: #f1f5f9;
}


.history-title h2::before {

    content: "";

    width: 5px;
    height: 18px;

    border-radius: 10px;

    background:

        linear-gradient(
            180deg,
            #818cf8,
            #7c3aed
        );

    box-shadow:

        0 0 10px
        rgba(99,102,241,.5);
}


.history-title span {

    display: block;

    margin-top: 4px;

    color: #535e72;

    font-size: 10px;
}


/* =========================================================
   CLEAR HISTORY 3D
========================================================= */

.clear-history {

    height: auto;

    padding:
        8px 12px;

    border-radius: 10px;

    color: #b07880;

    background:

        linear-gradient(
            145deg,
            #24171c,
            #171116
        );

    border:
        1px solid
        rgba(239,68,68,.10);

    box-shadow:

        0 4px 0
        #0b080a,

        0 7px 12px
        rgba(0,0,0,.25);

    font-size: 10px;
}


.clear-history:hover {

    color: #fca5a5;

    background:

        linear-gradient(
            145deg,
            #351c23,
            #201419
        );

    transform:
        translateY(-2px);
}


/* =========================================================
   TABLE WRAPPER
========================================================= */

.table-wrapper {

    overflow-x: auto;

    border-radius: 18px;

    border:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(5,8,14,.45);

    box-shadow:

        0 8px 0
        #080b11,

        0 14px 25px
        rgba(0,0,0,.28),

        inset 0 1px 0
        rgba(255,255,255,.04);

    scrollbar-width: thin;

    scrollbar-color:
        #394258 transparent;
}


.table-wrapper::-webkit-scrollbar {

    height: 5px;
}


.table-wrapper::-webkit-scrollbar-thumb {

    background:
        #394258;

    border-radius: 20px;
}


/* =========================================================
   TABLE
========================================================= */

table {

    width: 100%;

    border-collapse:
        collapse;

    min-width: 550px;
}


thead {

    background:

        linear-gradient(
            145deg,
            #1c2230,
            #121722
        );
}


th {

    padding:
        14px;

    text-align: left;

    color: #6f7a8f;

    font-size: 9px;

    text-transform:
        uppercase;

    letter-spacing: 1px;

    font-weight: 800;
}


td {

    padding:
        14px;

    border-top:
        1px solid
        rgba(255,255,255,.045);

    color: #adb7c7;

    font-size: 11px;
}


tbody tr {

    transition:
        background .2s,
        transform .2s;
}


tbody tr:hover {

    background:
        rgba(99,102,241,.035);
}


/* =========================================================
   HISTORY NUMBER
========================================================= */

.history-number {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    padding:
        5px 10px;

    border-radius: 8px;

    color: #c4b5fd;

    background:

        linear-gradient(
            145deg,
            rgba(99,102,241,.20),
            rgba(79,70,229,.08)
        );

    border:
        1px solid
        rgba(129,140,248,.15);

    box-shadow:

        0 3px 0
        rgba(49,46,129,.6),

        inset 0 1px 0
        rgba(255,255,255,.08);

    font-size: 10px;

    font-weight: 900;

    white-space: nowrap;
}


/* =========================================================
   NUMBERS
========================================================= */

.numbers-cell {

    color: #d4dae5;

    font-family:
        "Consolas",
        "Courier New",
        monospace;

    font-size: 11px;
}


/* =========================================================
   PCS
========================================================= */

.pcs-cell {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-width: 30px;

    padding:
        5px 8px;

    border-radius: 8px;

    background:

        linear-gradient(
            145deg,
            rgba(34,197,94,.16),
            rgba(22,163,74,.06)
        );

    border:
        1px solid
        rgba(34,197,94,.12);

    color: #4ade80;

    box-shadow:

        0 3px 0
        rgba(20,83,45,.6);

    font-weight: 900;

    font-size: 11px;
}


/* =========================================================
   TOTAL CELL
========================================================= */

.total-cell {

    color: #a5b4fc;

    font-weight: 900;

    font-size: 12px;

    text-shadow:

        0 2px 8px
        rgba(99,102,241,.20);
}


/* =========================================================
   EMPTY HISTORY
========================================================= */

.empty-history {

    padding: 32px !important;

    text-align: center;

    color: #505b70;

    font-size: 11px;

    background:
        rgba(0,0,0,.08);
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    margin-top: 20px;

    padding-top: 17px;

    border-top:
        1px solid
        rgba(255,255,255,.05);

    text-align: center;

    color: #505b6e;

    font-size: 10px;
}


.enter-key {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-width: 40px;

    padding:
        4px 8px;

    margin:
        0 4px;

    border-radius: 6px;

    background:

        linear-gradient(
            145deg,
            #1d2330,
            #10151e
        );

    border:
        1px solid
        rgba(255,255,255,.07);

    box-shadow:

        0 3px 0
        #080b10;

    color: #9aa5b8;

    font-family:
        "Consolas",
        monospace;

    font-size: 9px;

    font-weight: 700;
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width: 700px) {

    body {

        padding: 15px;

        align-items:
            flex-start;

        padding-top: 20px;
    }


    .container {

        padding: 22px;

        border-radius: 27px;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 600px) {

    body {

        padding: 9px;

        padding-top: 12px;
    }


    .container {

        width: 100%;

        padding: 17px;

        border-radius: 23px;
    }


    .header {

        align-items:
            flex-start;

        margin-bottom: 20px;
    }


    .icon {

        width: 44px;
        height: 44px;

        border-radius: 14px;

        font-size: 20px;

        box-shadow:

            0 8px 0
            #3730a3,

            0 13px 20px
            rgba(79,70,229,.30);
    }


    .title {

        gap: 11px;
    }


    .title h1 {

        font-size: 16px;
    }


    .title p {

        font-size: 9px;
    }


    .counter {

        padding:
            7px 9px;

        font-size: 9px;
    }


    .input-list {

        max-height: 300px;
    }


    .input-row {

        gap: 8px;

        margin-bottom: 10px;
    }


    .number {

        width: 36px;
        height: 48px;

        border-radius: 11px;

        box-shadow:

            0 4px 0
            #090d15,

            0 7px 12px
            rgba(0,0,0,.25);
    }


    input {

        height: 48px;

        border-radius: 13px;

        padding-left: 14px;

        font-size: 15px;
    }


    .button-area {

        grid-template-columns:
            1fr;

        gap: 10px;
    }


    button {

        height: 50px;
    }


    .result {

        padding:
            17px;

        border-radius: 16px;

        box-shadow:

            0 6px 0
            rgba(30,27,75,.8),

            0 13px 22px
            rgba(0,0,0,.25);
    }


    .result strong {

        font-size: 25px;
    }


    .history {

        margin-top: 24px;

        padding-top: 20px;
    }


    .history-header {

        align-items:
            flex-start;
    }


    .clear-history {

        padding:
            7px 9px;
    }


    .footer {

        font-size: 9px;
    }

}


/* =========================================================
   SMALL PHONE
========================================================= */

@media(max-width: 380px) {

    .container {

        padding: 14px;

        border-radius: 20px;
    }


    .title {

        gap: 8px;
    }


    .icon {

        width: 39px;
        height: 39px;

        font-size: 18px;
    }


    .title h1 {

        font-size: 14px;
    }


    .title p {

        font-size: 8px;
    }


    .counter {

        font-size: 8px;

        padding:
            6px 8px;
    }


    .number {

        width: 33px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="header">

        <div class="title">

            <div class="icon">
                Σ
            </div>

            <div>

                <h1>
                    Input Yard
                </h1>

                <p>
                    Masukkan angka secara berurutan
                </p>

            </div>

        </div>


        <div
            class="counter"
            id="counter">

            1 Data

        </div>

    </div>


    <!-- =====================================================
         INPUT LIST
    ====================================================== -->

    <div
        class="input-list"
        id="inputList">
    </div>


    <!-- =====================================================
         BUTTON AREA
    ====================================================== -->

    <div class="button-area">

        <button
            class="add-button"
            onclick="addInput(true)">

            ＋ Tambah Kolom

        </button>


        <button
            class="save-button"
            onclick="saveHistory()">

            ✓ Simpan ke History

        </button>

    </div>


    <!-- =====================================================
         TOTAL
    ====================================================== -->

    <div
        class="result"
        id="result">

        <div class="result-label">

            <span>
                Total Yard
            </span>

            <small>
                Jumlah seluruh angka
            </small>

        </div>


        <strong id="total">
            0
        </strong>

    </div>


    <!-- =====================================================
         HISTORY
    ====================================================== -->

    <div class="history">


        <div class="history-header">

            <div class="history-title">

                <h2>
                    History
                </h2>

                <span>
                    Riwayat Input Yard
                </span>

            </div>


            <button
                class="clear-history"
                onclick="clearHistory()">

                Hapus History

            </button>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            No
                        </th>

                        <th>
                            YARD
                        </th>

                        <th>
                            Total PCS
                        </th>

                        <th>
                            Total Yard
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="historyBody">

                    <tr
                        id="emptyHistory">

                        <td
                            colspan="4"
                            class="empty-history">

                            Belum ada history

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div class="footer">

        Tekan

        <span class="enter-key">
            Enter
        </span>

        untuk menambah kolom berikutnya

    </div>


</div>


<script>


/* =========================================================
   ELEMENT
========================================================= */

const inputList =
    document.getElementById(
        "inputList"
    );


const counter =
    document.getElementById(
        "counter"
    );


const result =
    document.getElementById(
        "result"
    );


const total =
    document.getElementById(
        "total"
    );


const historyBody =
    document.getElementById(
        "historyBody"
    );


/* =========================================================
   VARIABLES
========================================================= */

let number = 0;


/* =========================================================
   ADD INPUT
========================================================= */

function addInput(
    focusInput = true
) {

    number++;


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "input-row";


    row.innerHTML = `

        <div class="number">
            ${number}
        </div>

        <div class="input-wrapper">

            <input
                type="number"
                placeholder="Masukkan angka..."
                autocomplete="off"
            >

            <span class="check">
                ✓
            </span>

        </div>

    `;


    inputList.appendChild(row);


    const input =
        row.querySelector(
            "input"
        );


    /* =====================================================
       INPUT CHANGE
    ===================================================== */

    input.addEventListener(
        "input",
        function() {

            if (
                this.value.trim() !== ""
            ) {

                this.classList.add(
                    "valid"
                );

            } else {

                this.classList.remove(
                    "valid"
                );

            }


            calculateTotal();

        }
    );


    /* =====================================================
       ENTER
    ===================================================== */

    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key !== "Enter"
            ) {

                return;

            }


            event.preventDefault();


            /*
                Enter hanya bekerja
                jika angka sudah diisi.
            */

            if (
                this.value.trim() === ""
            ) {

                return;

            }


            const inputs =
                inputList.querySelectorAll(
                    "input"
                );


            const lastInput =
                inputs[
                    inputs.length - 1
                ];


            /*
                Jika input terakhir,
                buat input baru.
            */

            if (
                this === lastInput
            ) {

                addInput(true);

            } else {

                /*
                    Jika bukan input terakhir,
                    pindah ke input berikutnya.
                */

                const index =
                    Array
                    .from(inputs)
                    .indexOf(this);


                if (
                    inputs[index + 1]
                ) {

                    inputs[
                        index + 1
                    ].focus();

                }

            }

        }
    );


    if (focusInput) {

        setTimeout(
            () => input.focus(),
            50
        );

    }


    updateCounter();

}


/* =========================================================
   CALCULATE TOTAL
========================================================= */

function calculateTotal() {

    const inputs =
        inputList.querySelectorAll(
            "input"
        );


    let sum = 0;

    let filled = 0;


    inputs.forEach(
        input => {

            const value =
                parseFloat(
                    input.value
                );


            if (
                !isNaN(value)
            ) {

                sum += value;

                filled++;

            }

        }
    );


    total.textContent =
        sum.toLocaleString(
            "id-ID"
        );


    if (
        filled > 0
    ) {

        result.classList.add(
            "show"
        );

    } else {

        result.classList.remove(
            "show"
        );

    }

}


/* =========================================================
   UPDATE COUNTER
========================================================= */

function updateCounter() {

    const inputs =
        inputList.querySelectorAll(
            "input"
        );


    counter.textContent =
        `${inputs.length} Data`;

}


/* =========================================================
   SAVE HISTORY
========================================================= */

function saveHistory() {

    const inputs =
        inputList.querySelectorAll(
            "input"
        );


    const values = [];


    /*
        Ambil semua angka
        yang sudah diisi.
    */

    inputs.forEach(
        input => {

            if (
                input.value.trim() !== ""
            ) {

                values.push(
                    input.value
                );

            }

        }
    );


    /*
        Jangan simpan jika
        belum ada angka.
    */

    if (
        values.length === 0
    ) {

        alert(
            "Silakan masukkan angka terlebih dahulu."
        );

        return;

    }


    /* =====================================================
       HITUNG TOTAL
    ===================================================== */

    let sum = 0;


    values.forEach(
        value => {

            sum +=
                parseFloat(value);

        }
    );


    /* =====================================================
       HAPUS EMPTY HISTORY
    ===================================================== */

    const empty =
        document.getElementById(
            "emptyHistory"
        );


    if (empty) {

        empty.remove();

    }


    /* =====================================================
       FORMAT ANGKA
    ===================================================== */

    const formattedValues =
        "(" +
        values.join(", ") +
        ")";


    /* =====================================================
       BUAT ROW
    ===================================================== */

    const row =
        document.createElement(
            "tr"
        );


    row.innerHTML = `

        <td>

            <span
                class="history-number">

                SJ 0

            </span>

        </td>


        <td>

            <span
                class="numbers-cell">

                ${formattedValues}

            </span>

        </td>


        <td>

            <span
                class="pcs-cell">

                ${values.length}

            </span>

        </td>


        <td>

            <span
                class="total-cell">

                ${sum.toLocaleString("id-ID")}

            </span>

        </td>

    `;


    /*
        History baru ditambahkan
        ke bagian paling bawah.
    */

    historyBody.appendChild(
        row
    );


    /*
        Update nomor menjadi:
        SJ 1, SJ 2, SJ 3, dst.
    */

    updateHistoryNumber();


    /*
        Setelah disimpan,
        kosongkan input.
    */

    resetInput();

}


/* =========================================================
   UPDATE HISTORY NUMBER
========================================================= */

function updateHistoryNumber() {

    const rows =
        historyBody.querySelectorAll(
            "tr"
        );


    let nomor = 1;


    rows.forEach(
        row => {

            const numberElement =
                row.querySelector(
                    ".history-number"
                );


            if (numberElement) {

                numberElement.textContent =
                    `SJ ${nomor}`;

                nomor++;

            }

        }
    );

}


/* =========================================================
   RESET INPUT
========================================================= */

function resetInput() {

    inputList.innerHTML = "";


    number = 0;


    total.textContent =
        "0";


    result.classList.remove(
        "show"
    );


    /*
        Buat input baru.
    */

    addInput(true);

}


/* =========================================================
   CLEAR HISTORY
========================================================= */

function clearHistory() {

    historyBody.innerHTML = `

        <tr id="emptyHistory">

            <td
                colspan="4"
                class="empty-history">

                Belum ada history

            </td>

        </tr>

    `;

}


/* =========================================================
   START
========================================================= */

addInput(true);


</script>


</body>

</html>
