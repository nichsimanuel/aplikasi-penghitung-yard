<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>APLIKASI HITUNG YARD SURAT JALAN MANUAL</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    font-family:
        "Segoe UI",
        Inter,
        Arial,
        sans-serif;
}


/* =========================================================
   COLOR THEME
========================================================= */

:root {

    --darkest:
        #061710;

    --dark:
        #0b2118;

    --dark-2:
        #102d21;

    --dark-3:
        #163a2b;

    --green:
        #1f5c45;

    --green-light:
        #2e7d5b;

    --green-bright:
        #3f9b70;

    --cream:
        #f5eedc;

    --cream-light:
        #fffdf5;

    --cream-dark:
        #d8cdb5;

    --muted:
        #8fa59a;

    --border:
        rgba(245,238,220,.12);

    --shadow:
        rgba(0,0,0,.55);
}


/* =========================================================
   BODY
========================================================= */

body {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 25px;

    color:
        var(--cream-light);

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(46,125,91,.28),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 85%,
            rgba(31,92,69,.28),
            transparent 32%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(245,238,220,.06),
            transparent 30%
        ),

        var(--darkest);

    overflow-x: hidden;

    perspective: 1400px;
}


/* =========================================================
   BACKGROUND ORBS
========================================================= */

body::before {

    content: "";

    position: fixed;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    background:
        rgba(46,125,91,.14);

    filter:
        blur(90px);

    top: -120px;
    left: -100px;

    pointer-events: none;
}


body::after {

    content: "";

    position: fixed;

    width: 320px;
    height: 320px;

    border-radius: 50%;

    background:
        rgba(245,238,220,.06);

    filter:
        blur(100px);

    bottom: -150px;
    right: -120px;

    pointer-events: none;
}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container {

    width: 760px;

    max-width: 100%;

    position: relative;

    padding: 28px;

    border-radius: 32px;

    background:

        linear-gradient(
            145deg,
            #163a2b,
            #0a1d15 55%,
            #07150f
        );

    border:
        1px solid
        rgba(245,238,220,.12);

    box-shadow:

        0 45px 100px
        rgba(0,0,0,.65),

        0 18px 35px
        rgba(0,0,0,.35),

        inset 0 1px 0
        rgba(255,255,255,.09),

        inset 0 -2px 0
        rgba(0,0,0,.45);

    transform:
        rotateX(.5deg);

    transition:
        transform .35s ease,
        box-shadow .35s ease;
}


.container:hover {

    transform:
        rotateX(0deg)
        translateY(-2px);

    box-shadow:

        0 55px 110px
        rgba(0,0,0,.68),

        0 20px 40px
        rgba(0,0,0,.35),

        inset 0 1px 0
        rgba(255,255,255,.11),

        inset 0 -2px 0
        rgba(0,0,0,.5);
}


/* =========================================================
   TOP LIGHT
========================================================= */

.container::before {

    content: "";

    position: absolute;

    top: 0;
    left: 12%;

    width: 76%;
    height: 2px;

    border-radius: 50%;

    background:

        linear-gradient(
            90deg,
            transparent,
            var(--cream),
            var(--green-bright),
            transparent
        );

    box-shadow:

        0 0 18px
        rgba(245,238,220,.35);
}


/* =========================================================
   HEADER
========================================================= */

.header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 25px;
}


/* =========================================================
   TITLE
========================================================= */

.title {

    display: flex;

    align-items: center;

    gap: 14px;
}


/* =========================================================
   3D ICON
========================================================= */

.icon {

    width: 52px;
    height: 52px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 17px;

    color:
        var(--darkest);

    font-size: 23px;

    font-weight: 900;

    background:

        linear-gradient(
            145deg,
            #fffdf5,
            #e6dbc2 45%,
            #c9b996
        );

    border:
        1px solid
        rgba(255,255,255,.45);

    box-shadow:

        0 11px 0
        #8f8062,

        0 18px 28px
        rgba(0,0,0,.30),

        inset 0 2px 2px
        rgba(255,255,255,.7),

        inset 0 -5px 8px
        rgba(0,0,0,.10);

    text-shadow:
        0 1px 1px
        rgba(255,255,255,.4);

    transform:
        translateY(-3px);
}


.title h1 {

    font-size: 20px;

    font-weight: 800;

    letter-spacing: -.4px;

    color:
        var(--cream-light);

    text-shadow:
        0 2px 10px
        rgba(0,0,0,.35);
}


.title p {

    margin-top: 4px;

    color:
        var(--muted);

    font-size: 12px;
}


/* =========================================================
   COUNTER
========================================================= */

.counter {

    display: flex;

    align-items: center;

    gap: 7px;

    padding:
        9px 14px;

    border-radius: 20px;

    background:

        linear-gradient(
            145deg,
            #1d4635,
            #0d261b
        );

    border:
        1px solid
        rgba(245,238,220,.12);

    color:
        var(--cream);

    font-size: 11px;

    font-weight: 700;

    box-shadow:

        0 5px 0
        #06130d,

        0 10px 18px
        rgba(0,0,0,.30),

        inset 0 1px 0
        rgba(255,255,255,.07);
}


.counter::before {

    content: "";

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background:
        #63c58d;

    box-shadow:
        0 0 10px
        rgba(99,197,141,.9);
}


/* =========================================================
   INPUT LIST
========================================================= */

.input-list {

    max-height: 325px;

    overflow-y: auto;

    padding:
        5px 7px 5px 3px;

    scrollbar-width: thin;

    scrollbar-color:
        #426151 transparent;
}


.input-list::-webkit-scrollbar {

    width: 5px;
}


.input-list::-webkit-scrollbar-track {

    background: transparent;
}


.input-list::-webkit-scrollbar-thumb {

    background:

        linear-gradient(
            #557565,
            #263f33
        );

    border-radius: 20px;
}


/* =========================================================
   INPUT ROW
========================================================= */

.input-row {

    display: flex;

    align-items: center;

    gap: 12px;

    margin-bottom: 13px;

    animation:
        inputAppear .28s ease;

    transform-style:
        preserve-3d;
}


@keyframes inputAppear {

    from {

        opacity: 0;

        transform:
            translateY(12px)
            rotateX(-8deg);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            rotateX(0);
    }

}


/* =========================================================
   NUMBER 3D
========================================================= */

.number {

    width: 43px;
    height: 52px;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;

    border-radius: 14px;

    background:

        linear-gradient(
            145deg,
            #244a38,
            #10271d
        );

    border:
        1px solid
        rgba(245,238,220,.09);

    color:
        #9db5a8;

    font-size: 12px;

    font-weight: 800;

    box-shadow:

        0 5px 0
        #06130d,

        0 9px 16px
        rgba(0,0,0,.30),

        inset 0 1px 0
        rgba(255,255,255,.08);

    transform:
        translateZ(10px);
}


/* =========================================================
   INPUT WRAPPER
========================================================= */

.input-wrapper {

    position: relative;

    flex: 1;
}


/* =========================================================
   INPUT
========================================================= */

input {

    width: 100%;

    height: 52px;

    border:
        1px solid
        rgba(245,238,220,.10);

    border-radius: 15px;

    background:

        linear-gradient(
            145deg,
            #11251c,
            #081610
        );

    color:
        var(--cream-light);

    padding:
        0 50px 0 17px;

    font-size: 16px;

    font-weight: 600;

    outline: none;

    transition:
        .2s;

    box-shadow:

        0 6px 0
        #040d08,

        0 10px 20px
        rgba(0,0,0,.28),

        inset 0 1px 0
        rgba(255,255,255,.04),

        inset 0 -3px 8px
        rgba(0,0,0,.18);
}


input:hover {

    border-color:
        rgba(245,238,220,.22);
}


input:focus {

    border-color:
        var(--green-bright);

    background:

        linear-gradient(
            145deg,
            #183629,
            #0a1a12
        );

    box-shadow:

        0 6px 0
        #12402e,

        0 12px 25px
        rgba(46,125,91,.20),

        0 0 0 3px
        rgba(46,125,91,.10),

        inset 0 1px 0
        rgba(255,255,255,.08);
}


input::placeholder {

    color:
        #60756a;
}


/* REMOVE NUMBER ARROWS */

input::-webkit-inner-spin-button,
input::-webkit-outer-spin-button {

    -webkit-appearance: none;

    margin: 0;
}


input[type=number] {

    -moz-appearance:
        textfield;
}


/* =========================================================
   CHECK
========================================================= */

.check {

    position: absolute;

    right: 15px;

    top: 50%;

    transform:
        translateY(-50%)
        scale(.7);

    width: 22px;
    height: 22px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background:

        linear-gradient(
            145deg,
            #72d69c,
            #2e8b62
        );

    border:
        1px solid
        rgba(255,255,255,.18);

    color:
        white;

    font-size: 11px;

    font-weight: 900;

    opacity: 0;

    transition:
        .2s;

    box-shadow:

        0 3px 0
        #175236,

        0 5px 10px
        rgba(46,125,91,.25);
}


input.valid + .check {

    opacity: 1;

    transform:
        translateY(-50%)
        scale(1);
}


/* =========================================================
   BUTTON AREA
========================================================= */

.button-area {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 12px;

    margin-top: 12px;
}


button {

    height: 52px;

    border: none;

    border-radius: 15px;

    cursor: pointer;

    font-size: 12px;

    font-weight: 800;

    transition:
        transform .15s,
        box-shadow .15s;

    -webkit-tap-highlight-color:
        transparent;
}


button:active {

    transform:
        translateY(4px);
}


/* =========================================================
   ADD BUTTON 3D
========================================================= */

.add-button {

    color:
        var(--cream);

    background:

        linear-gradient(
            145deg,
            #244636,
            #132a20
        );

    border:
        1px solid
        rgba(245,238,220,.08);

    box-shadow:

        0 6px 0
        #06130d,

        0 12px 20px
        rgba(0,0,0,.28),

        inset 0 1px 0
        rgba(255,255,255,.07);
}


.add-button:hover {

    color:
        var(--cream-light);

    background:

        linear-gradient(
            145deg,
            #315c47,
            #1a3528
        );

    transform:
        translateY(-2px);

    box-shadow:

        0 8px 0
        #06130d,

        0 15px 25px
        rgba(0,0,0,.35);
}


/* =========================================================
   SAVE BUTTON 3D
========================================================= */

.save-button {

    color:
        #102319;

    background:

        linear-gradient(
            145deg,
            #fffdf5,
            #f5eedc 45%,
            #d8cdb5
        );

    border:
        1px solid
        rgba(255,255,255,.55);

    box-shadow:

        0 6px 0
        #9c8e70,

        0 14px 28px
        rgba(0,0,0,.28),

        inset 0 1px 0
        rgba(255,255,255,.8);
}


.save-button:hover {

    transform:
        translateY(-3px);

    background:

        linear-gradient(
            145deg,
            #ffffff,
            #fff8e8,
            #dfd3b9
        );

    box-shadow:

        0 9px 0
        #9c8e70,

        0 20px 35px
        rgba(0,0,0,.38),

        inset 0 1px 0
        white;
}


/* =========================================================
   TOTAL RESULT
========================================================= */

.result {

    display: none;

    margin-top: 17px;

    padding:
        19px 21px;

    border-radius: 19px;

    position: relative;

    overflow: hidden;

    background:

        linear-gradient(
            145deg,
            rgba(46,125,91,.28),
            rgba(15,52,38,.30)
        );

    border:
        1px solid
        rgba(143,190,163,.22);

    box-shadow:

        0 8px 0
        rgba(4,25,17,.85),

        0 18px 30px
        rgba(0,0,0,.28),

        inset 0 1px 0
        rgba(255,255,255,.08);
}


.result::before {

    content: "";

    position: absolute;

    width: 120px;
    height: 120px;

    border-radius: 50%;

    background:
        rgba(99,197,141,.10);

    filter:
        blur(28px);

    top: -65px;
    right: -35px;
}


.result.show {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    animation:
        resultAppear .3s ease;
}


@keyframes resultAppear {

    from {

        opacity: 0;

        transform:
            translateY(8px)
            scale(.98);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }

}


.result-label {

    display: flex;

    flex-direction: column;

    gap: 4px;

    position: relative;
}


.result-label span {

    color:
        #a9bcaf;

    font-size: 10px;

    text-transform:
        uppercase;

    letter-spacing: 1.5px;

    font-weight: 800;
}


.result-label small {

    color:
        #668075;

    font-size: 10px;
}


.result strong {

    position: relative;

    color:
        var(--cream);

    font-size: 29px;

    font-weight: 900;

    letter-spacing: -.8px;

    text-shadow:

        0 3px 12px
        rgba(245,238,220,.18);
}


/* =========================================================
   HISTORY
========================================================= */

.history {

    margin-top: 29px;

    padding-top: 23px;

    border-top:
        1px solid
        rgba(245,238,220,.07);
}


.history-header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 14px;
}


.history-title h2 {

    display: flex;

    align-items: center;

    gap: 9px;

    font-size: 15px;

    font-weight: 800;

    color:
        var(--cream-light);
}


.history-title h2::before {

    content: "";

    width: 5px;
    height: 18px;

    border-radius: 10px;

    background:

        linear-gradient(
            180deg,
            var(--cream),
            var(--green-bright)
        );

    box-shadow:

        0 0 10px
        rgba(99,197,141,.35);
}


.history-title span {

    display: block;

    margin-top: 4px;

    color:
        #60756a;

    font-size: 10px;
}


/* =========================================================
   CLEAR HISTORY 3D
========================================================= */

.clear-history {

    height: auto;

    padding:
        8px 12px;

    border-radius: 10px;

    color:
        #c8bda8;

    background:

        linear-gradient(
            145deg,
            #263c31,
            #15261e
        );

    border:
        1px solid
        rgba(245,238,220,.08);

    box-shadow:

        0 4px 0
        #06130d,

        0 7px 12px
        rgba(0,0,0,.25);

    font-size: 10px;
}


.clear-history:hover {

    color:
        var(--cream-light);

    background:

        linear-gradient(
            145deg,
            #365442,
            #1d3226
        );

    transform:
        translateY(-2px);
}


/* =========================================================
   TABLE WRAPPER
========================================================= */

.table-wrapper {

    overflow-x: auto;

    border-radius: 18px;

    border:
        1px solid
        rgba(245,238,220,.08);

    background:
        rgba(4,13,9,.45);

    box-shadow:

        0 8px 0
        #06100b,

        0 14px 25px
        rgba(0,0,0,.28),

        inset 0 1px 0
        rgba(255,255,255,.04);

    scrollbar-width: thin;

    scrollbar-color:
        #405d4d transparent;
}


.table-wrapper::-webkit-scrollbar {

    height: 5px;
}


.table-wrapper::-webkit-scrollbar-thumb {

    background:
        #405d4d;

    border-radius: 20px;
}


/* =========================================================
   TABLE
========================================================= */

table {

    width: 100%;

    border-collapse:
        collapse;

    min-width: 550px;
}


thead {

    background:

        linear-gradient(
            145deg,
            #1d382a,
            #10251b
        );
}


th {

    padding:
        14px;

    text-align: left;

    color:
        #899d91;

    font-size: 9px;

    text-transform:
        uppercase;

    letter-spacing: 1px;

    font-weight: 800;
}


td {

    padding:
        14px;

    border-top:
        1px solid
        rgba(245,238,220,.045);

    color:
        #b8c7bd;

    font-size: 11px;
}


tbody tr {

    transition:
        background .2s;
}


tbody tr:hover {

    background:
        rgba(46,125,91,.055);
}


/* =========================================================
   HISTORY NUMBER
========================================================= */

.history-number {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    padding:
        5px 10px;

    border-radius: 8px;

    color:
        var(--cream);

    background:

        linear-gradient(
            145deg,
            #315e47,
            #173628
        );

    border:
        1px solid
        rgba(245,238,220,.12);

    box-shadow:

        0 3px 0
        #07170f,

        inset 0 1px 0
        rgba(255,255,255,.08);

    font-size: 10px;

    font-weight: 900;

    white-space: nowrap;
}


/* =========================================================
   NUMBERS CELL
========================================================= */

.numbers-cell {

    color:
        #d8ded9;

    font-family:
        "Consolas",
        "Courier New",
        monospace;

    font-size: 11px;
}


/* =========================================================
   PCS CELL
========================================================= */

.pcs-cell {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-width: 30px;

    padding:
        5px 8px;

    border-radius: 8px;

    background:

        linear-gradient(
            145deg,
            rgba(99,197,141,.20),
            rgba(46,125,91,.08)
        );

    border:
        1px solid
        rgba(99,197,141,.15);

    color:
        #7ee2a5;

    box-shadow:

        0 3px 0
        rgba(11,55,36,.75);

    font-weight: 900;

    font-size: 11px;
}


/* =========================================================
   TOTAL CELL
========================================================= */

.total-cell {

    color:
        var(--cream);

    font-weight: 900;

    font-size: 12px;

    text-shadow:

        0 2px 8px
        rgba(245,238,220,.15);
}


/* =========================================================
   EMPTY HISTORY
========================================================= */

.empty-history {

    padding: 32px !important;

    text-align: center;

    color:
        #5d7166;

    font-size: 11px;

    background:
        rgba(0,0,0,.08);
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    margin-top: 20px;

    padding-top: 17px;

    border-top:
        1px solid
        rgba(245,238,220,.05);

    text-align: center;

    color:
        #607167;

    font-size: 10px;
}


.enter-key {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-width: 40px;

    padding:
        4px 8px;

    margin:
        0 4px;

    border-radius: 6px;

    background:

        linear-gradient(
            145deg,
            #20372b,
            #102219
        );

    border:
        1px solid
        rgba(245,238,220,.07);

    box-shadow:

        0 3px 0
        #06100b;

    color:
        #aabbb0;

    font-family:
        "Consolas",
        monospace;

    font-size: 9px;

    font-weight: 700;
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width: 700px) {

    body {

        padding: 15px;

        align-items:
            flex-start;

        padding-top: 20px;
    }


    .container {

        padding: 22px;

        border-radius: 27px;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 600px) {

    body {

        padding: 9px;

        padding-top: 12px;
    }


    .container {

        width: 100%;

        padding: 17px;

        border-radius: 23px;
    }


    .header {

        align-items:
            flex-start;

        margin-bottom: 20px;
    }


    .icon {

        width: 44px;
        height: 44px;

        border-radius: 14px;

        font-size: 20px;

        box-shadow:

            0 8px 0
            #8f8062,

            0 13px 20px
            rgba(0,0,0,.25);
    }


    .title {

        gap: 11px;
    }


    .title h1 {

        font-size: 16px;
    }


    .title p {

        font-size: 9px;
    }


    .counter {

        padding:
            7px 9px;

        font-size: 9px;
    }


    .input-list {

        max-height: 300px;
    }


    .input-row {

        gap: 8px;

        margin-bottom: 10px;
    }


    .number {

        width: 36px;
        height: 48px;

        border-radius: 11px;

        box-shadow:

            0 4px 0
            #06130d,

            0 7px 12px
            rgba(0,0,0,.25);
    }


    input {

        height: 48px;

        border-radius: 13px;

        padding-left: 14px;

        font-size: 15px;
    }


    .button-area {

        grid-template-columns:
            1fr;

        gap: 10px;
    }


    button {

        height: 50px;
    }


    .result {

        padding:
            17px;

        border-radius: 16px;

        box-shadow:

            0 6px 0
            rgba(4,25,17,.85),

            0 13px 22px
            rgba(0,0,0,.25);
    }


    .result strong {

        font-size: 25px;
    }


    .history {

        margin-top: 24px;

        padding-top: 20px;
    }


    .history-header {

        align-items:
            flex-start;
    }


    .clear-history {

        padding:
            7px 9px;
    }


    .footer {

        font-size: 9px;
    }

}


/* =========================================================
   SMALL PHONE
========================================================= */

@media(max-width: 380px) {

    .container {

        padding: 14px;

        border-radius: 20px;
    }


    .title {

        gap: 8px;
    }


    .icon {

        width: 39px;
        height: 39px;

        font-size: 18px;
    }


    .title h1 {

        font-size: 14px;
    }


    .title p {

        font-size: 8px;
    }


    .counter {

        font-size: 8px;

        padding:
            6px 8px;
    }


    .number {

        width: 33px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="header">

        <div class="title">

            <div class="icon">
                Σ
            </div>

            <div>

                <h1>
                    Input Yard
                </h1>

                <p>
                    Silahkan input yard sesuai dengan yang diberikan mandor.
                </p>

            </div>

        </div>


        <div
            class="counter"
            id="counter">

            1 Data

        </div>

    </div>


    <!-- =====================================================
         INPUT
    ====================================================== -->

    <div
        class="input-list"
        id="inputList">
    </div>


    <!-- =====================================================
         BUTTON
    ====================================================== -->

    <div class="button-area">

        <button
            class="add-button"
            onclick="addInput(true)">

            ＋ Tambah Kolom

        </button>


        <button
            class="save-button"
            onclick="saveHistory()">

            ✓ Simpan ke History

        </button>

    </div>


    <!-- =====================================================
         TOTAL
    ====================================================== -->

    <div
        class="result"
        id="result">

        <div class="result-label">

            <span>
                Total Yard
            </span>

            <small>
                Jumlah seluruh angka
            </small>

        </div>


        <strong id="total">
            0
        </strong>

    </div>


    <!-- =====================================================
         HISTORY
    ====================================================== -->

    <div class="history">


        <div class="history-header">

            <div class="history-title">

                <h2>
                    History
                </h2>

                <span>
                    Riwayat Input Yard
                </span>

            </div>


            <button
                class="clear-history"
                onclick="clearHistory()">

                Hapus History

            </button>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            No
                        </th>

                        <th>
                            YARD
                        </th>

                        <th>
                            Total PCS
                        </th>

                        <th>
                            Total Yard
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="historyBody">

                    <tr
                        id="emptyHistory">

                        <td
                            colspan="4"
                            class="empty-history">

                            Belum ada history

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div class="footer">

        Tekan

        <span class="enter-key">
            Enter
        </span>

        untuk menambah kolom berikutnya

    </div>


</div>


<script>


/* =========================================================
   ELEMENT
========================================================= */

const inputList =
    document.getElementById(
        "inputList"
    );


const counter =
    document.getElementById(
        "counter"
    );


const result =
    document.getElementById(
        "result"
    );


const total =
    document.getElementById(
        "total"
    );


const historyBody =
    document.getElementById(
        "historyBody"
    );


/* =========================================================
   VARIABLES
========================================================= */

let number = 0;


/* =========================================================
   ADD INPUT
========================================================= */

function addInput(
    focusInput = true
) {

    number++;


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "input-row";


    row.innerHTML = `

        <div class="number">
            ${number}
        </div>

        <div class="input-wrapper">

            <input
                type="number"
                placeholder="Masukkan yard..."
                autocomplete="off"
            >

            <span class="check">
                ✓
            </span>

        </div>

    `;


    inputList.appendChild(row);


    const input =
        row.querySelector(
            "input"
        );


    /* =====================================================
       INPUT CHANGE
    ===================================================== */

    input.addEventListener(
        "input",
        function() {

            if (
                this.value.trim() !== ""
            ) {

                this.classList.add(
                    "valid"
                );

            } else {

                this.classList.remove(
                    "valid"
                );

            }


            calculateTotal();

        }
    );


    /* =====================================================
       ENTER
    ===================================================== */

    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key !== "Enter"
            ) {

                return;

            }


            event.preventDefault();


            /*
                Enter hanya bekerja
                jika angka sudah diisi.
            */

            if (
                this.value.trim() === ""
            ) {

                return;

            }


            const inputs =
                inputList.querySelectorAll(
                    "input"
                );


            const lastInput =
                inputs[
                    inputs.length - 1
                ];


            /*
                Jika input terakhir,
                buat input baru.
            */

            if (
                this === lastInput
            ) {

                addInput(true);

            } else {

                /*
                    Jika bukan input terakhir,
                    pindah ke input berikutnya.
                */

                const index =
                    Array
                    .from(inputs)
                    .indexOf(this);


                if (
                    inputs[index + 1]
                ) {

                    inputs[
                        index + 1
                    ].focus();

                }

            }

        }
    );


    if (focusInput) {

        setTimeout(
            () => input.focus(),
            50
        );

    }


    updateCounter();

}


/* =========================================================
   CALCULATE TOTAL
========================================================= */

function calculateTotal() {

    const inputs =
        inputList.querySelectorAll(
            "input"
        );


    let sum = 0;

    let filled = 0;


    inputs.forEach(
        input => {

            const value =
                parseFloat(
                    input.value
                );


            if (
                !isNaN(value)
            ) {

                sum += value;

                filled++;

            }

        }
    );


    total.textContent =
        sum.toLocaleString(
            "id-ID"
        );


    if (
        filled > 0
    ) {

        result.classList.add(
            "show"
        );

    } else {

        result.classList.remove(
            "show"
        );

    }

}


/* =========================================================
   UPDATE COUNTER
========================================================= */

function updateCounter() {

    const inputs =
        inputList.querySelectorAll(
            "input"
        );


    counter.textContent =
        `${inputs.length} Data`;

}


/* =========================================================
   SAVE HISTORY
========================================================= */

function saveHistory() {

    const inputs =
        inputList.querySelectorAll(
            "input"
        );


    const values = [];


    /*
        Ambil semua angka
        yang sudah diisi.
    */

    inputs.forEach(
        input => {

            if (
                input.value.trim() !== ""
            ) {

                values.push(
                    input.value
                );

            }

        }
    );


    /*
        Jangan simpan jika
        belum ada angka.
    */

    if (
        values.length === 0
    ) {

        alert(
            "Silakan masukkan angka terlebih dahulu."
        );

        return;

    }


    /* =====================================================
       HITUNG TOTAL
    ===================================================== */

    let sum = 0;


    values.forEach(
        value => {

            sum +=
                parseFloat(value);

        }
    );


    /* =====================================================
       HAPUS EMPTY HISTORY
    ===================================================== */

    const empty =
        document.getElementById(
            "emptyHistory"
        );


    if (empty) {

        empty.remove();

    }


    /* =====================================================
       FORMAT ANGKA
    ===================================================== */

    const formattedValues =
        "(" +
        values.join(", ") +
        ")";


    /* =====================================================
       BUAT ROW
    ===================================================== */

    const row =
        document.createElement(
            "tr"
        );


    row.innerHTML = `

        <td>

            <span
                class="history-number">

                SJ 0

            </span>

        </td>


        <td>

            <span
                class="numbers-cell">

                ${formattedValues}

            </span>

        </td>


        <td>

            <span
                class="pcs-cell">

                ${values.length}

            </span>

        </td>


        <td>

            <span
                class="total-cell">

                ${sum.toLocaleString("id-ID")}

            </span>

        </td>

    `;


    /*
        History baru ditambahkan
        ke bagian paling bawah.
    */

    historyBody.appendChild(
        row
    );


    /*
        Update nomor:
        SJ 1, SJ 2, SJ 3, dst.
    */

    updateHistoryNumber();


    /*
        Setelah disimpan,
        kosongkan input.
    */

    resetInput();

}


/* =========================================================
   UPDATE HISTORY NUMBER
========================================================= */

function updateHistoryNumber() {

    const rows =
        historyBody.querySelectorAll(
            "tr"
        );


    let nomor = 1;


    rows.forEach(
        row => {

            const numberElement =
                row.querySelector(
                    ".history-number"
                );


            if (numberElement) {

                numberElement.textContent =
                    `SJ ${nomor}`;

                nomor++;

            }

        }
    );

}


/* =========================================================
   RESET INPUT
========================================================= */

function resetInput() {

    inputList.innerHTML = "";


    number = 0;


    total.textContent =
        "0";


    result.classList.remove(
        "show"
    );


    /*
        Buat input baru.
    */

    addInput(true);

}


/* =========================================================
   CLEAR HISTORY
========================================================= */

function clearHistory() {

    historyBody.innerHTML = `

        <tr id="emptyHistory">

            <td
                colspan="4"
                class="empty-history">

                Belum ada history

            </td>

        </tr>

    `;

}


/* =========================================================
   START
========================================================= */

addInput(true);


</script>


</body>

</html>
