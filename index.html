<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>APLIKASI HITUNG YARD SURAT JALAN MANUAL</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    font-family:
        "Segoe UI",
        Inter,
        Arial,
        sans-serif;
}


/* =========================================================
   NATURE FOREST COLOR THEME
========================================================= */

:root {

    --forest-deep:
        #10251a;

    --forest-dark:
        #173522;

    --forest:
        #1f4d32;

    --forest-light:
        #2f6b45;

    --leaf:
        #4f8f5f;

    --sage:
        #82a878;

    --mint:
        #a8c69f;

    --cream:
        #f4ecd8;

    --cream-light:
        #fffdf5;

    --sand:
        #d9c9a8;

    --earth:
        #715b3d;

    --earth-dark:
        #4a3b27;

    --muted:
        #91a895;

    --border:
        rgba(220,235,205,.13);

    --shadow:
        rgba(0,0,0,.55);
}


/* =========================================================
   BODY
========================================================= */

body {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 25px;

    color:
        var(--cream-light);

    background:

        radial-gradient(
            circle at 8% 12%,
            rgba(79,143,95,.28),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 15%,
            rgba(47,107,69,.20),
            transparent 28%
        ),

        radial-gradient(
            circle at 85% 90%,
            rgba(130,168,120,.14),
            transparent 30%
        ),

        radial-gradient(
            circle at 20% 90%,
            rgba(113,91,61,.12),
            transparent 28%
        ),

        #0b1c13;

    overflow-x: hidden;

    perspective: 1400px;
}


/* =========================================================
   BACKGROUND NATURE LIGHT
========================================================= */

body::before {

    content: "";

    position: fixed;

    width: 340px;
    height: 340px;

    border-radius: 50%;

    background:
        rgba(79,143,95,.15);

    filter:
        blur(95px);

    top: -130px;
    left: -100px;

    pointer-events: none;
}


body::after {

    content: "";

    position: fixed;

    width: 360px;
    height: 360px;

    border-radius: 50%;

    background:
        rgba(217,201,168,.07);

    filter:
        blur(110px);

    bottom: -170px;
    right: -140px;

    pointer-events: none;
}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container {

    width: 760px;

    max-width: 100%;

    position: relative;

    padding: 28px;

    border-radius: 32px;

    background:

        linear-gradient(
            145deg,
            #254d35,
            #163522 45%,
            #0e2117 75%,
            #091810
        );

    border:
        1px solid
        rgba(190,220,180,.16);

    box-shadow:

        0 45px 100px
        rgba(0,0,0,.68),

        0 18px 35px
        rgba(0,0,0,.38),

        inset 0 1px 0
        rgba(255,255,255,.10),

        inset 0 -3px 0
        rgba(0,0,0,.45);

    transform:
        rotateX(.5deg);

    transition:
        transform .35s ease,
        box-shadow .35s ease;
}


.container:hover {

    transform:
        rotateX(0deg)
        translateY(-2px);

    box-shadow:

        0 55px 110px
        rgba(0,0,0,.72),

        0 20px 40px
        rgba(0,0,0,.40),

        inset 0 1px 0
        rgba(255,255,255,.12),

        inset 0 -3px 0
        rgba(0,0,0,.52);
}


/* =========================================================
   TOP NATURE LIGHT
========================================================= */

.container::before {

    content: "";

    position: absolute;

    top: 0;
    left: 12%;

    width: 76%;
    height: 2px;

    border-radius: 50%;

    background:

        linear-gradient(
            90deg,
            transparent,
            var(--mint),
            var(--sage),
            transparent
        );

    box-shadow:

        0 0 18px
        rgba(168,198,159,.40);
}


/* =========================================================
   HEADER
========================================================= */

.header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 25px;
}


/* =========================================================
   TITLE
========================================================= */

.title {

    display: flex;

    align-items: center;

    gap: 14px;
}


/* =========================================================
   NATURE ICON
========================================================= */

.icon {

    width: 52px;
    height: 52px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 17px;

    color:
        #173522;

    font-size: 23px;

    font-weight: 900;

    background:

        linear-gradient(
            145deg,
            #f8f1df,
            #e4d5b4 48%,
            #c7b58d
        );

    border:
        1px solid
        rgba(255,255,255,.50);

    box-shadow:

        0 11px 0
        #766344,

        0 18px 28px
        rgba(0,0,0,.30),

        inset 0 2px 2px
        rgba(255,255,255,.75),

        inset 0 -5px 8px
        rgba(0,0,0,.10);

    text-shadow:
        0 1px 1px
        rgba(255,255,255,.45);

    transform:
        translateY(-3px);
}


.title h1 {

    font-size: 20px;

    font-weight: 800;

    letter-spacing: -.4px;

    color:
        var(--cream-light);

    text-shadow:
        0 2px 10px
        rgba(0,0,0,.35);
}


.title p {

    margin-top: 4px;

    color:
        var(--muted);

    font-size: 12px;
}


/* =========================================================
   COUNTER
========================================================= */

.counter {

    display: flex;

    align-items: center;

    gap: 7px;

    padding:
        9px 14px;

    border-radius: 20px;

    background:

        linear-gradient(
            145deg,
            #315e3e,
            #173523
        );

    border:
        1px solid
        rgba(190,220,180,.14);

    color:
        var(--cream);

    font-size: 11px;

    font-weight: 700;

    box-shadow:

        0 5px 0
        #07150d,

        0 10px 18px
        rgba(0,0,0,.30),

        inset 0 1px 0
        rgba(255,255,255,.08);
}


.counter::before {

    content: "";

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background:
        #91c783;

    box-shadow:
        0 0 10px
        rgba(145,199,131,.9);
}


/* =========================================================
   INPUT LIST
========================================================= */

.input-list {

    max-height: 325px;

    overflow-y: auto;

    padding:
        5px 7px 5px 3px;

    scrollbar-width: thin;

    scrollbar-color:
        #58755c transparent;
}


.input-list::-webkit-scrollbar {

    width: 5px;
}


.input-list::-webkit-scrollbar-track {

    background: transparent;
}


.input-list::-webkit-scrollbar-thumb {

    background:

        linear-gradient(
            #6d9270,
            #304c37
        );

    border-radius: 20px;
}


/* =========================================================
   INPUT ROW
========================================================= */

.input-row {

    display: flex;

    align-items: center;

    gap: 12px;

    margin-bottom: 13px;

    animation:
        inputAppear .28s ease;

    transform-style:
        preserve-3d;
}


@keyframes inputAppear {

    from {

        opacity: 0;

        transform:
            translateY(12px)
            rotateX(-8deg);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            rotateX(0);
    }

}


/* =========================================================
   NUMBER
========================================================= */

.number {

    width: 43px;
    height: 52px;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;

    border-radius: 14px;

    background:

        linear-gradient(
            145deg,
            #365f42,
            #193524
        );

    border:
        1px solid
        rgba(210,230,200,.12);

    color:
        #aec3a9;

    font-size: 12px;

    font-weight: 800;

    box-shadow:

        0 5px 0
        #07150d,

        0 9px 16px
        rgba(0,0,0,.30),

        inset 0 1px 0
        rgba(255,255,255,.09);

    transform:
        translateZ(10px);
}


/* =========================================================
   INPUT WRAPPER
========================================================= */

.input-wrapper {

    position: relative;

    flex: 1;
}


/* =========================================================
   INPUT
========================================================= */

input {

    width: 100%;

    height: 52px;

    border:
        1px solid
        rgba(210,230,200,.12);

    border-radius: 15px;

    background:

        linear-gradient(
            145deg,
            #183124,
            #0d1f15
        );

    color:
        var(--cream-light);

    padding:
        0 50px 0 17px;

    font-size: 16px;

    font-weight: 600;

    outline: none;

    transition:
        .2s;

    box-shadow:

        0 6px 0
        #06110a,

        0 10px 20px
        rgba(0,0,0,.28),

        inset 0 1px 0
        rgba(255,255,255,.05),

        inset 0 -3px 8px
        rgba(0,0,0,.18);
}


input:hover {

    border-color:
        rgba(190,220,180,.28);
}


input:focus {

    border-color:
        var(--sage);

    background:

        linear-gradient(
            145deg,
            #254b32,
            #102519
        );

    box-shadow:

        0 6px 0
        #244d2f,

        0 12px 25px
        rgba(79,143,95,.22),

        0 0 0 3px
        rgba(130,168,120,.12),

        inset 0 1px 0
        rgba(255,255,255,.09);
}


input::placeholder {

    color:
        #718674;
}


/* REMOVE NUMBER ARROWS */

input::-webkit-inner-spin-button,
input::-webkit-outer-spin-button {

    -webkit-appearance: none;

    margin: 0;
}


input[type=number] {

    -moz-appearance:
        textfield;
}


/* =========================================================
   CHECK
========================================================= */

.check {

    position: absolute;

    right: 15px;

    top: 50%;

    transform:
        translateY(-50%)
        scale(.7);

    width: 22px;
    height: 22px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background:

        linear-gradient(
            145deg,
            #b0d39f,
            #4f8f5f
        );

    border:
        1px solid
        rgba(255,255,255,.20);

    color:
        #173522;

    font-size: 11px;

    font-weight: 900;

    opacity: 0;

    transition:
        .2s;

    box-shadow:

        0 3px 0
        #315c39,

        0 5px 10px
        rgba(79,143,95,.30);
}


input.valid + .check {

    opacity: 1;

    transform:
        translateY(-50%)
        scale(1);
}


/* =========================================================
   BUTTON AREA
========================================================= */

.button-area {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 12px;

    margin-top: 12px;
}


button {

    height: 52px;

    border: none;

    border-radius: 15px;

    cursor: pointer;

    font-size: 12px;

    font-weight: 800;

    transition:
        transform .15s,
        box-shadow .15s;

    -webkit-tap-highlight-color:
        transparent;
}


button:active {

    transform:
        translateY(4px);
}


/* =========================================================
   ADD BUTTON
========================================================= */

.add-button {

    color:
        #e9f0e4;

    background:

        linear-gradient(
            145deg,
            #365f42,
            #1b3826
        );

    border:
        1px solid
        rgba(190,220,180,.12);

    box-shadow:

        0 6px 0
        #07150d,

        0 12px 20px
        rgba(0,0,0,.28),

        inset 0 1px 0
        rgba(255,255,255,.08);
}


.add-button:hover {

    color:
        white;

    background:

        linear-gradient(
            145deg,
            #4b7853,
            #254b31
        );

    transform:
        translateY(-2px);

    box-shadow:

        0 8px 0
        #07150d,

        0 15px 25px
        rgba(0,0,0,.35);
}


/* =========================================================
   SAVE BUTTON
========================================================= */

.save-button {

    color:
        #18301f;

    background:

        linear-gradient(
            145deg,
            #f8f1df,
            #eee3c8 45%,
            #d2c19b
        );

    border:
        1px solid
        rgba(255,255,255,.60);

    box-shadow:

        0 6px 0
        #806d49,

        0 14px 28px
        rgba(0,0,0,.28),

        inset 0 1px 0
        rgba(255,255,255,.85);
}


.save-button:hover {

    transform:
        translateY(-3px);

    background:

        linear-gradient(
            145deg,
            #fffdf5,
            #f8eed7,
            #d9c8a5
        );

    box-shadow:

        0 9px 0
        #806d49,

        0 20px 35px
        rgba(0,0,0,.38),

        inset 0 1px 0
        white;
}


/* =========================================================
   TOTAL RESULT
========================================================= */

.result {

    display: none;

    margin-top: 17px;

    padding:
        19px 21px;

    border-radius: 19px;

    position: relative;

    overflow: hidden;

    background:

        linear-gradient(
            145deg,
            rgba(79,143,95,.30),
            rgba(25,65,38,.34)
        );

    border:
        1px solid
        rgba(168,198,159,.25);

    box-shadow:

        0 8px 0
        rgba(4,25,13,.85),

        0 18px 30px
        rgba(0,0,0,.28),

        inset 0 1px 0
        rgba(255,255,255,.08);
}


.result::before {

    content: "";

    position: absolute;

    width: 120px;
    height: 120px;

    border-radius: 50%;

    background:
        rgba(145,199,131,.12);

    filter:
        blur(28px);

    top: -65px;
    right: -35px;
}


.result.show {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    animation:
        resultAppear .3s ease;
}


@keyframes resultAppear {

    from {

        opacity: 0;

        transform:
            translateY(8px)
            scale(.98);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }

}


.result-label {

    display: flex;

    flex-direction: column;

    gap: 4px;

    position: relative;
}


.result-label span {

    color:
        #b6c8b0;

    font-size: 10px;

    text-transform:
        uppercase;

    letter-spacing: 1.5px;

    font-weight: 800;
}


.result-label small {

    color:
        #77917c;

    font-size: 10px;
}


.result strong {

    position: relative;

    color:
        var(--cream);

    font-size: 29px;

    font-weight: 900;

    letter-spacing: -.8px;

    text-shadow:

        0 3px 12px
        rgba(217,201,168,.22);
}


/* =========================================================
   HISTORY
========================================================= */

.history {

    margin-top: 29px;

    padding-top: 23px;

    border-top:
        1px solid
        rgba(210,230,200,.08);
}


.history-header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 14px;
}


.history-title h2 {

    display: flex;

    align-items: center;

    gap: 9px;

    font-size: 15px;

    font-weight: 800;

    color:
        var(--cream-light);
}


.history-title h2::before {

    content: "";

    width: 5px;
    height: 18px;

    border-radius: 10px;

    background:

        linear-gradient(
            180deg,
            var(--mint),
            var(--leaf)
        );

    box-shadow:

        0 0 10px
        rgba(130,168,120,.40);
}


.history-title span {

    display: block;

    margin-top: 4px;

    color:
        #6f8774;

    font-size: 10px;
}


/* =========================================================
   CLEAR HISTORY
========================================================= */

.clear-history {

    height: auto;

    padding:
        8px 12px;

    border-radius: 10px;

    color:
        #d4c8ad;

    background:

        linear-gradient(
            145deg,
            #344c3a,
            #1c3023
        );

    border:
        1px solid
        rgba(210,230,200,.10);

    box-shadow:

        0 4px 0
        #07150d,

        0 7px 12px
        rgba(0,0,0,.25);

    font-size: 10px;
}


.clear-history:hover {

    color:
        white;

    background:

        linear-gradient(
            145deg,
            #4b664e,
            #29422f
        );

    transform:
        translateY(-2px);
}


/* =========================================================
   TABLE WRAPPER
========================================================= */

.table-wrapper {

    overflow-x: auto;

    border-radius: 18px;

    border:
        1px solid
        rgba(210,230,200,.09);

    background:
        rgba(4,13,8,.48);

    box-shadow:

        0 8px 0
        #06110a,

        0 14px 25px
        rgba(0,0,0,.28),

        inset 0 1px 0
        rgba(255,255,255,.04);

    scrollbar-width: thin;

    scrollbar-color:
        #4d684f transparent;
}


.table-wrapper::-webkit-scrollbar {

    height: 5px;
}


.table-wrapper::-webkit-scrollbar-thumb {

    background:
        #4d684f;

    border-radius: 20px;
}


/* =========================================================
   TABLE
========================================================= */

table {

    width: 100%;

    border-collapse:
        collapse;

    min-width: 550px;
}


thead {

    background:

        linear-gradient(
            145deg,
            #2b4b34,
            #183122
        );
}


th {

    padding:
        14px;

    text-align: left;

    color:
        #a1b19f;

    font-size: 9px;

    text-transform:
        uppercase;

    letter-spacing: 1px;

    font-weight: 800;
}


td {

    padding:
        14px;

    border-top:
        1px solid
        rgba(210,230,200,.05);

    color:
        #becabd;

    font-size: 11px;
}


tbody tr {

    transition:
        background .2s;
}


tbody tr:hover {

    background:
        rgba(79,143,95,.07);
}


/* =========================================================
   HISTORY NUMBER
========================================================= */

.history-number {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    padding:
        5px 10px;

    border-radius: 8px;

    color:
        var(--cream);

    background:

        linear-gradient(
            145deg,
            #477250,
            #24482f
        );

    border:
        1px solid
        rgba(210,230,200,.13);

    box-shadow:

        0 3px 0
        #07150d,

        inset 0 1px 0
        rgba(255,255,255,.09);

    font-size: 10px;

    font-weight: 900;

    white-space: nowrap;
}


/* =========================================================
   NUMBERS CELL
========================================================= */

.numbers-cell {

    color:
        #d9dfd6;

    font-family:
        "Consolas",
        "Courier New",
        monospace;

    font-size: 11px;
}

   PCS CELL

        linear-gradient(

            rgba(145,199,131,.23),

        );

        1px solid
        rgba(145,199,131,.17);

    color:
        #b1d99f;

        0 3px 0

    font-weight: 900;

}


/* =========================================================
   TOTAL CELL
========================================================= */

.total-cell {

    color:
        var(--cream);

    font-weight: 900;

    font-size: 12px;

    text-shadow:

        0 2px 8px
        rgba(217,201,168,.18);

/* =========================================================
   EMPTY HISTORY
========================================================= */

.empty-history {

    padding: 32px !important;

    text-align: center;

    color:
        #617765;

    font-size: 11px;

    background:
        rgba(0,0,0,.08);
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    margin-top: 20px;

    padding-top: 17px;

    border-top:
        1px solid
        rgba(210,230,200,.06);

    text-align: center;

    color:
        #6d8271;

    font-size: 10px;
}


.enter-key {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-width: 40px;

    padding:
        4px 8px;

    margin:

        linear-gradient(

            #29422f,

        );

    border:
        1px solid
        rgba(210,230,200,.08);

    box-shadow:

        0 3px 0
        #06110a;

    color:
        #b1c0b0;

    font-family:
        "Consolas",
        monospace;

    font-size: 9px;

    font-weight: 700;
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width: 700px) {

    body {

        padding: 15px;

        align-items:
            flex-start;

        padding-top: 20px;
    }


    .container {

        padding: 22px;

        border-radius: 27px;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 600px) {

    body {

        padding: 9px;

        padding-top: 12px;
    }


    .container {

        width: 100%;

        padding: 17px;

        border-radius: 23px;

    .header {

        align-items:
            flex-start;

        margin-bottom: 20px;

    .icon {

        width: 44px;

        border-radius: 14px;

        font-size: 20px;

        box-shadow:

            rgba(0,0,0,.25);
    }


    .title {

        gap: 11px;

    .title h1 {

        font-size: 16px;

    .title p {

        font-size: 9px;
    }


    .counter {

        padding:
            7px 9px;

        font-size: 9px;
    }


    .input-list {

        max-height: 300px;
    }


    .input-row {

        gap: 8px;

        margin-bottom: 10px;
    }


    .number {

        width: 36px;
        height: 48px;

        border-radius: 11px;

        box-shadow:

            0 4px 0
            #07150d,

            0 7px 12px
            rgba(0,0,0,.25);
    }


    input {

        height: 48px;

        border-radius: 13px;

        padding-left: 14px;

        font-size: 15px;
    }


    .button-area {

        grid-template-columns:
            1fr;

        gap: 10px;
    }


    button {

        height: 50px;

    .result {

        padding:
            17px;

        border-radius: 16px;

        box-shadow:

    }

}


/* =========================================================
   SMALL PHONE
========================================================= */

@media(max-width: 380px) {

    .container {

        padding: 14px;

        border-radius: 20px;
    }

    .icon {

}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="header">

        <div class="title">

            <div class="icon">
                Σ
            </div>

            <div>

                <h1>
                    Input Yard
                </h1>

                <p>
                    Silahkan input yard sesuai dengan yang diberikan mandor.
                </p>

            </div>

        </div>


        <div
            class="counter"
            id="counter">

            1 Data

        </div>

    </div>


    <!-- =====================================================
         INPUT
    ====================================================== -->

    <div
        class="input-list"
        id="inputList">
    </div>


    <!-- =====================================================
         BUTTON
    ====================================================== -->

    <div class="button-area">

        <button
            class="add-button"
            onclick="addInput(true)">

            ＋ Tambah Kolom

        </button>


        <button
            class="save-button"
            onclick="saveHistory()">

            ✓ Simpan ke History

        </button>

    </div>


    <!-- =====================================================
         TOTAL
    ====================================================== -->

    <div
        class="result"
        id="result">

        <div class="result-label">

            <span>
                Total Yard
            </span>

            <small>
                Jumlah seluruh angka
            </small>

        </div>


        <strong id="total">
            0
        </strong>

    </div>


    <!-- =====================================================
         HISTORY
    ====================================================== -->

    <div class="history">


        <div class="history-header">

            <div class="history-title">

                <h2>
                    History
                </h2>

                <span>
                    Riwayat Input Yard
                </span>

            </div>


            <button
                class="clear-history"
                onclick="clearHistory()">

                Hapus History

            </button>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            No
                        </th>

                        <th>
                            YARD
                        </th>

                        <th>
                            Total PCS
                        </th>

                        <th>
                            Total Yard
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="historyBody">

                    <tr
                        id="emptyHistory">

                        <td
                            colspan="4"
                            class="empty-history">

                            Belum ada history

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div class="footer">

        Tekan

        <span class="enter-key">
            Enter
        </span>

        untuk menambah kolom berikutnya

    </div>


</div>


<script>


/* =========================================================
   ELEMENT
========================================================= */

const inputList =
    document.getElementById(
        "inputList"
    );


const counter =
    document.getElementById(
        "counter"
    );


const result =
    document.getElementById(
        "result"
    );


const total =
    document.getElementById(
        "total"
    );


const historyBody =
    document.getElementById(
        "historyBody"
    );


/* =========================================================
   VARIABLES
========================================================= */

let number = 0;


/* =========================================================
   ADD INPUT
========================================================= */

function addInput(
    focusInput = true
) {

    number++;


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "input-row";


    row.innerHTML = `

        <div class="number">
            ${number}
        </div>

        <div class="input-wrapper">

            <input
                type="number"
                placeholder="Masukkan yard..."
                autocomplete="off"
            >

            <span class="check">
                ✓
            </span>

        </div>

    `;


    inputList.appendChild(row);


    const input =
        row.querySelector(
            "input"
        );


    /* =====================================================
       INPUT CHANGE
    ===================================================== */

    input.addEventListener(
        "input",
        function() {

            if (
                this.value.trim() !== ""
            ) {

                this.classList.add(
                    "valid"
                );

            } else {

                this.classList.remove(
                    "valid"
                );

            }


            calculateTotal();

        }
    );


    /* =====================================================
       ENTER
    ===================================================== */

    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key !== "Enter"
            ) {

                return;

            }


            event.preventDefault();


            /*
                Enter hanya bekerja
                jika angka sudah diisi.
            */

            if (
                this.value.trim() === ""
            ) {

                return;

            }


            const inputs =
                inputList.querySelectorAll(
                    "input"
                );


            const lastInput =
                inputs[
                    inputs.length - 1
                ];


            /*
                Jika input terakhir,
                buat input baru.
            */

            if (
                this === lastInput
            ) {

                addInput(true);

            } else {

                /*
                    Jika bukan input terakhir,
                    pindah ke input berikutnya.
                */

                const index =
                    Array
                    .from(inputs)
                    .indexOf(this);


                if (
                    inputs[index + 1]
                ) {

                    inputs[
                        index + 1
                    ].focus();

                }

            }

        }
    );


    if (focusInput) {

        setTimeout(
            () => input.focus(),
            50
        );

    }


    updateCounter();

}


/* =========================================================
   CALCULATE TOTAL
========================================================= */

function calculateTotal() {

    const inputs =
        inputList.querySelectorAll(
            "input"
        );


    let sum = 0;

    let filled = 0;


    inputs.forEach(
        input => {

            const value =
                parseFloat(
                    input.value
                );


            if (
                !isNaN(value)
            ) {

                sum += value;

                filled++;

            }

        }
    );


    total.textContent =
        sum.toLocaleString(
            "id-ID"
        );


    if (
        filled > 0
    ) {

        result.classList.add(
            "show"
        );

    } else {

        result.classList.remove(
            "show"
        );

    }

}


/* =========================================================
   UPDATE COUNTER
========================================================= */

function updateCounter() {

    const inputs =
        inputList.querySelectorAll(
            "input"
        );


    counter.textContent =
        `${inputs.length} Data`;

}


/* =========================================================
   SAVE HISTORY
========================================================= */

function saveHistory() {

    const inputs =
        inputList.querySelectorAll(
            "input"
        );


    const values = [];


    /*
        Ambil semua angka
        yang sudah diisi.
    */

    inputs.forEach(
        input => {

            if (
                input.value.trim() !== ""
            ) {

                values.push(
                    input.value
                );

            }

        }
    );


    /*
        Jangan simpan jika
        belum ada angka.
    */

    if (
        values.length === 0
    ) {

        alert(
            "Silakan masukkan angka terlebih dahulu."
        );

        return;

    }


    /* =====================================================
       HITUNG TOTAL
    ===================================================== */

    let sum = 0;


    values.forEach(
        value => {

            sum +=
                parseFloat(value);

        }
    );


    /* =====================================================
       HAPUS EMPTY HISTORY
    ===================================================== */

    const empty =
        document.getElementById(
            "emptyHistory"
        );


    if (empty) {

        empty.remove();

    }


    /* =====================================================
       FORMAT ANGKA
    ===================================================== */

    const formattedValues =
        "(" +
        values.join(", ") +
        ")";


    /* =====================================================
       BUAT ROW
    ===================================================== */

    const row =
        document.createElement(
            "tr"
        );


    row.innerHTML = `

        <td>

            <span
                class="history-number">

                SJ 0

            </span>

        </td>


        <td>

            <span
                class="numbers-cell">

                ${formattedValues}

            </span>

        </td>


        <td>

            <span
                class="pcs-cell">

                ${values.length}

            </span>

        </td>


        <td>

            <span
                class="total-cell">

                ${sum.toLocaleString("id-ID")}

            </span>

        </td>

    `;


    /*
        History baru ditambahkan
        ke bagian paling bawah.
    */

    historyBody.appendChild(
        row
    );


    /*
        Update nomor:
        SJ 1, SJ 2, SJ 3, dst.
    */

    updateHistoryNumber();


    /*
        Setelah disimpan,
        kosongkan input.
    */

    resetInput();

}


/* =========================================================
   UPDATE HISTORY NUMBER
========================================================= */

function updateHistoryNumber() {

    const rows =
        historyBody.querySelectorAll(
            "tr"
        );


    let nomor = 1;


    rows.forEach(
        row => {

            const numberElement =
                row.querySelector(
                    ".history-number"
                );


            if (numberElement) {

                numberElement.textContent =
                    `SJ ${nomor}`;

                nomor++;

            }

        }
    );

}


/* =========================================================
   RESET INPUT
========================================================= */

function resetInput() {

    inputList.innerHTML = "";


    number = 0;


    total.textContent =
        "0";


    result.classList.remove(
        "show"
    );


    /*
        Buat input baru.
    */

    addInput(true);

}


/* =========================================================
   CLEAR HISTORY
========================================================= */

function clearHistory() {

    historyBody.innerHTML = `

        <tr id="emptyHistory">

            <td
                colspan="4"
                class="empty-history">

                Belum ada history

            </td>

        </tr>

    `;

}


/* =========================================================
   START
========================================================= */

addInput(true);


</script>


</body>

</html>
