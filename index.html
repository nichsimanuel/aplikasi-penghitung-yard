<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>APLIKASI HITUNG SURAT JALAN MANUAL</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    font-family:
        "Segoe UI",
        Inter,
        Arial,
        sans-serif;
}


/* =====================================================
   BODY
===================================================== */

body {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 24px;

    color: #f8fafc;

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(99,102,241,.22),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(139,92,246,.18),
            transparent 32%
        ),

        radial-gradient(
            circle at 50% 0%,
            rgba(56,189,248,.08),
            transparent 30%
        ),

        #070a11;

    overflow-x: hidden;
}


/* =====================================================
   DECORATION
===================================================== */

body::before {

    content: "";

    position: fixed;

    width: 320px;
    height: 320px;

    border-radius: 50%;

    background:
        rgba(99,102,241,.08);

    filter: blur(90px);

    top: -120px;
    right: -100px;

    pointer-events: none;
}


body::after {

    content: "";

    position: fixed;

    width: 280px;
    height: 280px;

    border-radius: 50%;

    background:
        rgba(139,92,246,.07);

    filter: blur(90px);

    bottom: -100px;
    left: -100px;

    pointer-events: none;
}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.container {

    width: 760px;

    max-width: 100%;

    position: relative;

    padding: 26px;

    border-radius: 30px;

    background:

        linear-gradient(
            145deg,
            rgba(23,28,40,.97),
            rgba(11,15,24,.97)
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:

        0 35px 90px
        rgba(0,0,0,.55),

        inset 0 1px 0
        rgba(255,255,255,.04);
}


/* =====================================================
   TOP LINE
===================================================== */

.container::before {

    content: "";

    position: absolute;

    top: 0;
    left: 15%;

    width: 70%;
    height: 1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(129,140,248,.8),
            transparent
        );
}


/* =====================================================
   HEADER
===================================================== */

.header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 24px;
}


/* =====================================================
   TITLE
===================================================== */

.title {

    display: flex;

    align-items: center;

    gap: 13px;
}


.icon {

    width: 50px;
    height: 50px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 16px;

    background:

        linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

    color: white;

    font-size: 23px;

    font-weight: 800;

    box-shadow:

        0 10px 25px
        rgba(99,102,241,.30);
}


.title h1 {

    font-size: 19px;

    font-weight: 750;

    letter-spacing: -.3px;

    color: #f8fafc;
}


.title p {

    margin-top: 4px;

    color: #717b8f;

    font-size: 12px;
}


/* =====================================================
   COUNTER
===================================================== */

.counter {

    display: flex;

    align-items: center;

    gap: 7px;

    padding:
        8px 13px;

    border-radius: 30px;

    background:
        rgba(99,102,241,.09);

    border:
        1px solid
        rgba(129,140,248,.15);

    color: #a5b4fc;

    font-size: 11px;

    font-weight: 600;

    white-space: nowrap;
}


.counter::before {

    content: "";

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #6366f1;

    box-shadow:
        0 0 10px
        rgba(99,102,241,.8);
}


/* =====================================================
   INPUT SECTION
===================================================== */

.input-list {

    max-height: 330px;

    overflow-y: auto;

    padding:
        4px 7px 4px 2px;

    scrollbar-width: thin;

    scrollbar-color:
        #30384b transparent;
}


.input-list::-webkit-scrollbar {

    width: 5px;
}


.input-list::-webkit-scrollbar-track {

    background: transparent;
}


.input-list::-webkit-scrollbar-thumb {

    background: #30384b;

    border-radius: 20px;
}


/* =====================================================
   INPUT ROW
===================================================== */

.input-row {

    display: flex;

    align-items: center;

    gap: 11px;

    margin-bottom: 11px;

    animation:
        slideIn .25s ease;
}


@keyframes slideIn {

    from {

        opacity: 0;

        transform:
            translateY(10px)
            scale(.98);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =====================================================
   NUMBER
===================================================== */

.number {

    width: 42px;
    height: 52px;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;

    border-radius: 14px;

    background:

        linear-gradient(
            145deg,
            #1c2230,
            #131823
        );

    border:
        1px solid
        rgba(255,255,255,.06);

    color: #737d91;

    font-size: 12px;

    font-weight: 700;
}


/* =====================================================
   INPUT WRAPPER
===================================================== */

.input-wrapper {

    position: relative;

    flex: 1;
}


input {

    width: 100%;

    height: 52px;

    border:
        1px solid
        #252d3b;

    border-radius: 15px;

    background:
        rgba(7,10,17,.75);

    color: #f8fafc;

    padding:
        0 48px 0 17px;

    font-size: 16px;

    font-weight: 500;

    outline: none;

    transition:
        border .2s,
        box-shadow .2s,
        background .2s,
        transform .2s;
}


input:hover {

    border-color:
        #343d4f;

    background:
        rgba(10,14,23,.9);
}


input:focus {

    border-color:
        #6366f1;

    background:
        rgba(12,16,27,.98);

    box-shadow:

        0 0 0 3px
        rgba(99,102,241,.10),

        0 8px 25px
        rgba(0,0,0,.15);
}


input::placeholder {

    color: #454e60;
}


/* Remove number arrows */

input::-webkit-inner-spin-button,
input::-webkit-outer-spin-button {

    -webkit-appearance: none;

    margin: 0;
}


input[type=number] {

    -moz-appearance: textfield;
}


/* =====================================================
   CHECK
===================================================== */

.check {

    position: absolute;

    right: 15px;

    top: 50%;

    transform:
        translateY(-50%)
        scale(.7);

    width: 21px;
    height: 21px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        rgba(34,197,94,.12);

    color: #22c55e;

    font-size: 11px;

    opacity: 0;

    transition:
        .2s;
}


input.valid + .check {

    opacity: 1;

    transform:
        translateY(-50%)
        scale(1);
}


/* =====================================================
   BUTTON AREA
===================================================== */

.button-area {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 11px;

    margin-top: 12px;
}


button {

    height: 51px;

    border: none;

    border-radius: 15px;

    cursor: pointer;

    font-size: 12px;

    font-weight: 700;

    transition:
        transform .18s,
        box-shadow .18s,
        background .18s;

    -webkit-tap-highlight-color:
        transparent;
}


button:active {

    transform:
        scale(.97);
}


/* =====================================================
   ADD BUTTON
===================================================== */

.add-button {

    background:

        linear-gradient(
            145deg,
            #181e2b,
            #121722
        );

    border:
        1px solid
        rgba(255,255,255,.06);

    color: #aeb7c8;
}


.add-button:hover {

    background:

        linear-gradient(
            145deg,
            #222a3a,
            #181f2c
        );

    color: white;

    border-color:
        rgba(255,255,255,.10);
}


/* =====================================================
   SAVE BUTTON
===================================================== */

.save-button {

    background:

        linear-gradient(
            135deg,
            #6366f1,
            #7c3aed
        );

    color: white;

    box-shadow:

        0 10px 25px
        rgba(99,102,241,.20);
}


.save-button:hover {

    transform:
        translateY(-2px);

    box-shadow:

        0 15px 30px
        rgba(99,102,241,.30);
}


/* =====================================================
   RESULT
===================================================== */

.result {

    display: none;

    margin-top: 15px;

    padding:
        18px 20px;

    border-radius: 18px;

    background:

        linear-gradient(
            135deg,
            rgba(99,102,241,.13),
            rgba(139,92,246,.07)
        );

    border:
        1px solid
        rgba(129,140,248,.16);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.03);

    animation:
        resultIn .25s ease;
}


@keyframes resultIn {

    from {

        opacity: 0;

        transform:
            translateY(7px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }

}


.result.show {

    display: flex;

    justify-content:
        space-between;

    align-items: center;
}


.result-label {

    display: flex;

    flex-direction: column;

    gap: 4px;
}


.result-label span {

    color: #8b96aa;

    font-size: 10px;

    text-transform:
        uppercase;

    letter-spacing: 1.4px;

    font-weight: 700;
}


.result-label small {

    color: #505b6e;

    font-size: 10px;
}


.result strong {

    color: #c4b5fd;

    font-size: 28px;

    font-weight: 800;

    letter-spacing: -.5px;
}


/* =====================================================
   HISTORY
===================================================== */

.history {

    margin-top: 27px;

    padding-top: 22px;

    border-top:
        1px solid
        rgba(255,255,255,.06);
}


.history-header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 13px;
}


.history-title h2 {

    display: flex;

    align-items: center;

    gap: 8px;

    font-size: 15px;

    font-weight: 700;

    color: #eef2f7;
}


.history-title h2::before {

    content: "";

    width: 4px;
    height: 17px;

    border-radius: 10px;

    background:

        linear-gradient(
            180deg,
            #6366f1,
            #8b5cf6
        );
}


.history-title span {

    display: block;

    margin-top: 4px;

    color: #515c6f;

    font-size: 10px;
}


/* =====================================================
   CLEAR HISTORY
===================================================== */

.clear-history {

    height: auto;

    padding:
        8px 12px;

    border-radius: 10px;

    background:
        rgba(239,68,68,.06);

    border:
        1px solid
        rgba(239,68,68,.10);

    color: #8e6268;

    font-size: 10px;
}


.clear-history:hover {

    background:
        rgba(239,68,68,.12);

    color: #fca5a5;

    border-color:
        rgba(239,68,68,.18);
}


/* =====================================================
   TABLE WRAPPER
===================================================== */

.table-wrapper {

    overflow-x: auto;

    border-radius: 17px;

    border:
        1px solid
        rgba(255,255,255,.06);

    background:
        rgba(7,10,17,.35);

    scrollbar-width: thin;
}


.table-wrapper::-webkit-scrollbar {

    height: 5px;
}


.table-wrapper::-webkit-scrollbar-thumb {

    background: #30384b;

    border-radius: 20px;
}


/* =====================================================
   TABLE
===================================================== */

table {

    width: 100%;

    border-collapse:
        collapse;

    min-width: 550px;
}


thead {

    background:
        rgba(21,26,36,.95);
}


th {

    padding:
        13px 14px;

    text-align: left;

    color: #697488;

    font-size: 9px;

    text-transform:
        uppercase;

    letter-spacing: 1px;

    font-weight: 700;
}


td {

    padding:
        13px 14px;

    border-top:
        1px solid
        rgba(255,255,255,.045);

    color: #aeb7c7;

    font-size: 11px;
}


tbody tr {

    transition:
        background .18s;
}


tbody tr:hover {

    background:
        rgba(99,102,241,.035);
}


/* =====================================================
   HISTORY NUMBER
===================================================== */

.history-number {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    padding:
        5px 9px;

    border-radius: 8px;

    background:
        rgba(99,102,241,.09);

    border:
        1px solid
        rgba(99,102,241,.12);

    color: #a5b4fc;

    font-size: 10px;

    font-weight: 800;

    white-space: nowrap;
}


/* =====================================================
   NUMBERS CELL
===================================================== */

.numbers-cell {

    color: #cbd5e1;

    font-family:
        "Consolas",
        "Courier New",
        monospace;

    font-size: 11px;
}


/* =====================================================
   PCS CELL
===================================================== */

.pcs-cell {

    display: inline-block;

    min-width: 28px;

    padding:
        4px 7px;

    text-align: center;

    border-radius: 7px;

    background:
        rgba(34,197,94,.08);

    color: #4ade80;

    font-weight: 800;

    font-size: 11px;
}


/* =====================================================
   TOTAL CELL
===================================================== */

.total-cell {

    color: #a5b4fc;

    font-weight: 800;

    font-size: 12px;
}


/* =====================================================
   EMPTY HISTORY
===================================================== */

.empty-history {

    padding: 30px !important;

    text-align: center;

    color: #4d586b;

    font-size: 11px;
}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    margin-top: 19px;

    padding-top: 16px;

    border-top:
        1px solid
        rgba(255,255,255,.05);

    text-align: center;

    color: #4c5668;

    font-size: 10px;
}


.enter-key {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-width: 38px;

    padding:
        4px 8px;

    margin:
        0 4px;

    border-radius: 6px;

    background:
        #151a24;

    border:
        1px solid
        rgba(255,255,255,.07);

    color: #8d98aa;

    font-family:
        "Consolas",
        monospace;

    font-size: 9px;
}


/* =====================================================
   RESPONSIVE TABLET
===================================================== */

@media(max-width: 700px) {

    body {

        padding: 14px;

        align-items:
            flex-start;

        padding-top: 18px;
    }


    .container {

        padding: 20px;

        border-radius: 24px;
    }

}


/* =====================================================
   RESPONSIVE HP
===================================================== */

@media(max-width: 600px) {

    body {

        padding: 10px;

        padding-top: 12px;
    }


    .container {

        width: 100%;

        padding: 17px;

        border-radius: 22px;
    }


    .header {

        align-items:
            flex-start;

        margin-bottom: 20px;
    }


    .icon {

        width: 44px;
        height: 44px;

        border-radius: 13px;

        font-size: 20px;
    }


    .title h1 {

        font-size: 16px;
    }


    .title p {

        font-size: 10px;
    }


    .counter {

        padding:
            7px 10px;

        font-size: 9px;
    }


    .input-list {

        max-height: 300px;
    }


    .input-row {

        gap: 8px;

        margin-bottom: 9px;
    }


    .number {

        width: 35px;
        height: 48px;

        border-radius: 11px;

        font-size: 11px;
    }


    input {

        height: 48px;

        border-radius: 13px;

        padding-left: 14px;

        font-size: 15px;
    }


    .check {

        right: 13px;
    }


    .button-area {

        grid-template-columns:
            1fr;

        gap: 9px;

        margin-top: 10px;
    }


    button {

        height: 49px;
    }


    .result {

        padding:
            16px;

        border-radius: 15px;
    }


    .result strong {

        font-size: 24px;
    }


    .history {

        margin-top: 23px;

        padding-top: 19px;
    }


    .history-header {

        align-items:
            flex-start;
    }


    .clear-history {

        padding:
            7px 9px;
    }


    .footer {

        font-size: 9px;
    }

}


/* =====================================================
   VERY SMALL PHONE
===================================================== */

@media(max-width: 380px) {

    .container {

        padding: 14px;
    }


    .title {

        gap: 9px;
    }


    .icon {

        width: 40px;
        height: 40px;
    }


    .title h1 {

        font-size: 14px;
    }


    .title p {

        font-size: 9px;
    }


    .counter {

        font-size: 8px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <div class="title">

            <div class="icon">
                Σ
            </div>

            <div>

                <h1>
                    Input Yard
                </h1>

                <p>
                    Masukkan angka secara berurutan
                </p>

            </div>

        </div>


        <div
            class="counter"
            id="counter">

            1 Data

        </div>

    </div>


    <!-- INPUT -->

    <div
        class="input-list"
        id="inputList">
    </div>


    <!-- BUTTON -->

    <div class="button-area">

        <button
            class="add-button"
            onclick="addInput(true)">

            ＋ Tambah Kolom

        </button>


        <button
            class="save-button"
            onclick="saveHistory()">

            ✓ Simpan ke History

        </button>

    </div>


    <!-- TOTAL -->

    <div
        class="result"
        id="result">

        <div class="result-label">

            <span>
                Total Yard
            </span>

            <small>
                Jumlah seluruh angka
            </small>

        </div>


        <strong id="total">
            0
        </strong>

    </div>


    <!-- HISTORY -->

    <div class="history">


        <div class="history-header">

            <div class="history-title">

                <h2>
                    History
                </h2>

                <span>
                    Riwayat Input Yard
                </span>

            </div>


            <button
                class="clear-history"
                onclick="clearHistory()">

                Hapus History

            </button>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            No
                        </th>

                        <th>
                            YARD
                        </th>

                        <th>
                            Total PCS
                        </th>

                        <th>
                            Total Yard
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="historyBody">

                    <tr
                        id="emptyHistory">

                        <td
                            colspan="4"
                            class="empty-history">

                            Belum ada history

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        Tekan

        <span class="enter-key">
            Enter
        </span>

        untuk menambah kolom berikutnya

    </div>


</div>


<script>


/* =====================================================
   ELEMENT
===================================================== */

const inputList =
    document.getElementById(
        "inputList"
    );


const counter =
    document.getElementById(
        "counter"
    );


const result =
    document.getElementById(
        "result"
    );


const total =
    document.getElementById(
        "total"
    );


const historyBody =
    document.getElementById(
        "historyBody"
    );


/* =====================================================
   VARIABLES
===================================================== */

let number = 0;


/* =====================================================
   ADD INPUT
===================================================== */

function addInput(
    focusInput = true
) {

    number++;


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "input-row";


    row.innerHTML = `

        <div class="number">
            ${number}
        </div>

        <div class="input-wrapper">

            <input
                type="number"
                placeholder="Masukkan angka..."
                autocomplete="off"
            >

            <span class="check">
                ✓
            </span>

        </div>

    `;


    inputList.appendChild(row);


    const input =
        row.querySelector(
            "input"
        );


    /* INPUT CHANGE */

    input.addEventListener(
        "input",
        function() {

            if (
                this.value.trim() !== ""
            ) {

                this.classList.add(
                    "valid"
                );

            } else {

                this.classList.remove(
                    "valid"
                );

            }


            calculateTotal();

        }
    );


    /* ENTER */

    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key !== "Enter"
            ) {

                return;

            }


            event.preventDefault();


            if (
                this.value.trim() === ""
            ) {

                return;

            }


            const inputs =
                inputList.querySelectorAll(
                    "input"
                );


            const lastInput =
                inputs[
                    inputs.length - 1
                ];


            if (
                this === lastInput
            ) {

                addInput(true);

            } else {

                const index =
                    Array
                    .from(inputs)
                    .indexOf(this);


                if (
                    inputs[index + 1]
                ) {

                    inputs[
                        index + 1
                    ].focus();

                }

            }

        }
    );


    if (focusInput) {

        setTimeout(
            () => input.focus(),
            50
        );

    }


    updateCounter();

}


/* =====================================================
   CALCULATE TOTAL
===================================================== */

function calculateTotal() {

    const inputs =
        inputList.querySelectorAll(
            "input"
        );


    let sum = 0;

    let filled = 0;


    inputs.forEach(
        input => {

            const value =
                parseFloat(
                    input.value
                );


            if (
                !isNaN(value)
            ) {

                sum += value;

                filled++;

            }

        }
    );


    total.textContent =
        sum.toLocaleString(
            "id-ID"
        );


    if (
        filled > 0
    ) {

        result.classList.add(
            "show"
        );

    } else {

        result.classList.remove(
            "show"
        );

    }

}


/* =====================================================
   UPDATE COUNTER
===================================================== */

function updateCounter() {

    const inputs =
        inputList.querySelectorAll(
            "input"
        );


    counter.textContent =
        `${inputs.length} Data`;

}


/* =====================================================
   SAVE HISTORY
===================================================== */

function saveHistory() {

    const inputs =
        inputList.querySelectorAll(
            "input"
        );


    const values = [];


    inputs.forEach(
        input => {

            if (
                input.value.trim() !== ""
            ) {

                values.push(
                    input.value
                );

            }

        }
    );


    if (
        values.length === 0
    ) {

        alert(
            "Silakan masukkan angka terlebih dahulu."
        );

        return;

    }


    /* HITUNG TOTAL */

    let sum = 0;


    values.forEach(
        value => {

            sum +=
                parseFloat(value);

        }
    );


    /* HAPUS EMPTY HISTORY */

    const empty =
        document.getElementById(
            "emptyHistory"
        );


    if (empty) {

        empty.remove();

    }


    /* FORMAT ANGKA */

    const formattedValues =
        "(" +
        values.join(", ") +
        ")";


    /* BUAT ROW */

    const row =
        document.createElement(
            "tr"
        );


    row.innerHTML = `

        <td>

            <span
                class="history-number">

                SJ 0

            </span>

        </td>


        <td>

            <span
                class="numbers-cell">

                ${formattedValues}

            </span>

        </td>


        <td>

            <span
                class="pcs-cell">

                ${values.length}

            </span>

        </td>


        <td>

            <span
                class="total-cell">

                ${sum.toLocaleString("id-ID")}

            </span>

        </td>

    `;


    historyBody.appendChild(
        row
    );


    updateHistoryNumber();


    resetInput();

}


/* =====================================================
   UPDATE HISTORY NUMBER
===================================================== */

function updateHistoryNumber() {

    const rows =
        historyBody.querySelectorAll(
            "tr"
        );


    let nomor = 1;


    rows.forEach(
        row => {

            const numberElement =
                row.querySelector(
                    ".history-number"
                );


            if (numberElement) {

                numberElement.textContent =
                    `SJ ${nomor}`;

                nomor++;

            }

        }
    );

}


/* =====================================================
   RESET INPUT
===================================================== */

function resetInput() {

    inputList.innerHTML = "";


    number = 0;


    total.textContent =
        "0";


    result.classList.remove(
        "show"
    );


    addInput(true);

}


/* =====================================================
   CLEAR HISTORY
===================================================== */

function clearHistory() {

    historyBody.innerHTML = `

        <tr id="emptyHistory">

            <td
                colspan="4"
                class="empty-history">

                Belum ada history

            </td>

        </tr>

    `;

}


/* =====================================================
   START
===================================================== */

addInput(true);


</script>
