<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PT SION NIAGA PERKASA</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Inter, Arial, sans-serif;
}

:root {
    --darkest: #07111f;
    --dark: #0b1728;
    --dark-2: #101f34;
    --dark-3: #172b45;

    --blue: #1e4f7a;
    --blue-light: #2c6fa6;
    --blue-bright: #4d9bd3;

    --gold: #d6a84f;
    --gold-light: #f0cc7a;
    --gold-dark: #9b7227;

    --white: #ffffff;
    --cream: #f5f0e5;
    --cream-light: #fffdf8;
    --muted: #8fa1b5;

    --success: #5dcc8b;
}

/* =========================================================
   BODY
========================================================= */

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px;

    color: var(--cream-light);

    /*
       BACKGROUND ALAM TERANG
       Tidak menggunakan overlay gelap pada seluruh gambar.
    */

    background-image:
        url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=2200&q=90");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    overflow-x: hidden;

    perspective: 1400px;
}

/*
   Efek cahaya sangat ringan hanya di sisi layar.
   Tidak menutupi gambar alam.
*/

body::before {
    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: -1;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(255, 255, 255, 0.10),
            transparent 25%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(255, 255, 255, 0.08),
            transparent 28%
        );
}

/* =========================================================
   CONTAINER
========================================================= */

.container {
    width: 760px;

    max-width: 100%;

    position: relative;

    padding: 28px;

    border-radius: 32px;

    background:
        linear-gradient(
            145deg,
            rgba(23, 43, 69, 0.97),
            rgba(11, 23, 40, 0.98) 55%,
            rgba(6, 15, 27, 0.99)
        );

    border:
        1px solid rgba(240, 204, 122, 0.16);

    box-shadow:
        0 45px 100px rgba(0, 0, 0, 0.55),
        0 18px 35px rgba(0, 0, 0, 0.30),
        inset 0 1px 0 rgba(255, 255, 255, 0.09),
        inset 0 -2px 0 rgba(0, 0, 0, 0.45);

    transform: rotateX(0.5deg);

    transition: 0.35s;

    backdrop-filter: blur(12px);
}

.container:hover {
    transform:
        rotateX(0deg)
        translateY(-2px);
}

.container::before {
    content: "";

    position: absolute;

    top: 0;
    left: 10%;

    width: 80%;
    height: 2px;

    border-radius: 50%;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--gold),
            var(--gold-light),
            var(--blue-bright),
            transparent
        );

    box-shadow:
        0 0 18px rgba(214, 168, 79, 0.4);
}

/* =========================================================
   HEADER
========================================================= */

.header {
    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 15px;

    margin-bottom: 25px;
}

.title {
    display: flex;

    align-items: center;

    gap: 14px;
}

.icon {
    width: 52px;
    height: 52px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 17px;

    color: #101c2d;

    font-size: 18px;

    font-weight: 900;

    background:
        linear-gradient(
            145deg,
            #fffdf8,
            #f0cc7a 48%,
            #b88932
        );

    border:
        1px solid rgba(255, 255, 255, 0.55);

    box-shadow:
        0 11px 0 #76561f,
        0 18px 28px rgba(0, 0, 0, 0.32),
        inset 0 2px 2px rgba(255, 255, 255, 0.75);

    transform: translateY(-3px);
}

.title h1 {
    font-size: 20px;

    font-weight: 800;

    color: var(--cream-light);

    letter-spacing: 0.2px;
}

.title p {
    margin-top: 4px;

    color: var(--muted);

    font-size: 12px;
}

/* =========================================================
   COUNTER
========================================================= */

.counter {
    display: flex;

    align-items: center;

    gap: 7px;

    padding: 9px 14px;

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            #203b5a,
            #0d1b2d
        );

    border:
        1px solid rgba(240, 204, 122, 0.15);

    color: var(--cream);

    font-size: 11px;

    font-weight: 700;

    white-space: nowrap;

    box-shadow:
        0 5px 0 #040a12,
        0 10px 18px rgba(0, 0, 0, 0.30);
}

.counter::before {
    content: "";

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--success);

    box-shadow:
        0 0 10px rgba(93, 204, 139, 0.9);
}

/* =========================================================
   INPUT LIST
========================================================= */

.input-list {
    max-height: 325px;

    overflow-y: auto;

    padding: 5px 7px 5px 3px;

    scrollbar-width: thin;

    scrollbar-color:
        #486987
        transparent;
}

.input-list::-webkit-scrollbar {
    width: 5px;
}

.input-list::-webkit-scrollbar-thumb {
    background:
        linear-gradient(
            #6d91b1,
            #263d55
        );

    border-radius: 20px;
}

/* =========================================================
   INPUT ROW
========================================================= */

.input-row {
    display: flex;

    align-items: center;

    gap: 12px;

    margin-bottom: 13px;

    animation:
        inputAppear
        0.28s
        ease;
}

@keyframes inputAppear {

    from {
        opacity: 0;

        transform:
            translateY(12px)
            rotateX(-8deg);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            rotateX(0);
    }

}

/* =========================================================
   NUMBER
========================================================= */

.number {
    width: 43px;
    height: 52px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 14px;

    background:
        linear-gradient(
            145deg,
            #244766,
            #102237
        );

    border:
        1px solid rgba(240, 204, 122, 0.10);

    color: #a9b9c9;

    font-size: 12px;

    font-weight: 800;

    box-shadow:
        0 5px 0 #040b13,
        0 9px 16px rgba(0, 0, 0, 0.30);
}

/* =========================================================
   INPUT WRAPPER
========================================================= */

.input-wrapper {
    position: relative;

    flex: 1;
}

.input-wrapper input {
    width: 100%;
    height: 52px;

    border:
        1px solid rgba(240, 204, 122, 0.10);

    border-radius: 15px;

    background:
        linear-gradient(
            145deg,
            #12243a,
            #08131f
        );

    color: var(--cream-light);

    padding:
        0 50px 0 17px;

    font-size: 16px;

    font-weight: 600;

    outline: none;

    transition: 0.2s;

    box-shadow:
        0 6px 0 #030912,
        0 10px 20px rgba(0, 0, 0, 0.28);
}

.input-wrapper input:focus {
    border-color:
        var(--gold);

    background:
        linear-gradient(
            145deg,
            #1b344f,
            #0a1726
        );

    box-shadow:
        0 6px 0 #5b431a,
        0 0 0 3px
        rgba(214, 168, 79, 0.11);
}

.input-wrapper input::placeholder {
    color: #63778d;
}

.input-wrapper input::-webkit-inner-spin-button,
.input-wrapper input::-webkit-outer-spin-button {
    -webkit-appearance: none;

    margin: 0;
}

.input-wrapper input[type="number"] {
    -moz-appearance: textfield;
}

/* =========================================================
   CHECK
========================================================= */

.check {
    position: absolute;

    right: 15px;
    top: 50%;

    transform:
        translateY(-50%)
        scale(0.7);

    width: 22px;
    height: 22px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #7be5a7,
            #2f9363
        );

    color: white;

    font-size: 11px;

    font-weight: 900;

    opacity: 0;

    transition: 0.2s;
}

.input-wrapper input.valid + .check {
    opacity: 1;

    transform:
        translateY(-50%)
        scale(1);
}

/* =========================================================
   BUTTON
========================================================= */

.button-area {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 12px;

    margin-top: 12px;
}

button {
    height: 52px;

    border: none;

    border-radius: 15px;

    cursor: pointer;

    font-size: 12px;

    font-weight: 800;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;
}

button:hover {
    transform:
        translateY(-4px)
        scale(1.02);

    filter: brightness(1.08);
}

button:active {
    transform:
        translateY(2px)
        scale(0.98);
}

.add-button {
    color: var(--cream);

    background:
        linear-gradient(
            145deg,
            #274b6c,
            #132b43
        );

    box-shadow:
        0 6px 0 #040b13,
        0 12px 20px rgba(0, 0, 0, 0.28);
}

.add-button:hover {
    box-shadow:
        0 10px 0 #040b13,
        0 18px 28px rgba(0, 0, 0, 0.38);
}

.save-button {
    color: #1b2430;

    background:
        linear-gradient(
            145deg,
            #fffdf8,
            #f0cc7a 48%,
            #c49a4a
        );

    box-shadow:
        0 6px 0 #806023,
        0 14px 28px rgba(0, 0, 0, 0.28);
}

.save-button:hover {
    box-shadow:
        0 10px 0 #806023,
        0 20px 32px rgba(0, 0, 0, 0.38);
}

/* =========================================================
   RESULT
========================================================= */

.result {
    display: none;

    margin-top: 17px;

    padding: 19px 21px;

    border-radius: 19px;

    background:
        linear-gradient(
            145deg,
            rgba(44, 111, 166, 0.25),
            rgba(18, 48, 76, 0.30)
        );

    border:
        1px solid rgba(127, 177, 218, 0.22);

    box-shadow:
        0 8px 0 rgba(3, 12, 22, 0.85),
        0 18px 30px rgba(0, 0, 0, 0.28);
}

.result.show {
    display: flex;

    justify-content: space-between;

    align-items: center;
}

.result-label {
    display: flex;

    flex-direction: column;

    gap: 4px;
}

.result-label span {
    color: #afbdca;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 1.5px;

    font-weight: 800;
}

.result-label small {
    color: #6e8296;

    font-size: 10px;
}

.result strong {
    color: var(--gold-light);

    font-size: 29px;

    font-weight: 900;

    text-shadow:
        0 0 18px rgba(214, 168, 79, 0.15);
}

/* =========================================================
   HISTORY
========================================================= */

.history {
    margin-top: 29px;

    padding-top: 23px;

    border-top:
        1px solid rgba(240, 204, 122, 0.08);

    font-weight: 700;
}

.history-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 14px;
}

.history-title h2 {
    font-size: 15px;

    font-weight: 900;

    color: var(--cream-light);
}

.history-title span {
    display: block;

    margin-top: 4px;

    color: #667a8e;

    font-size: 10px;

    font-weight: 700;
}

.clear-history {
    height: auto;

    padding: 8px 12px;

    border-radius: 10px;

    color: #d0c4aa;

    background:
        linear-gradient(
            145deg,
            #263c52,
            #142537
        );

    box-shadow:
        0 4px 0 #040b13,
        0 7px 12px rgba(0, 0, 0, 0.25);

    font-size: 10px;

    font-weight: 800;
}

.clear-history:hover {
    box-shadow:
        0 7px 0 #040b13,
        0 12px 18px rgba(0, 0, 0, 0.35);
}

/* =========================================================
   TABLE
========================================================= */

.table-wrapper {
    overflow-x: auto;

    border-radius: 18px;

    border:
        1px solid rgba(240, 204, 122, 0.08);

    background:
        rgba(3, 11, 20, 0.45);

    box-shadow:
        0 8px 0 #040b13,
        0 14px 25px rgba(0, 0, 0, 0.28);
}

table {
    width: 100%;

    border-collapse: collapse;

    min-width: 760px;
}

thead {
    background:
        linear-gradient(
            145deg,
            #203c58,
            #102238
        );
}

th {
    padding: 14px;

    text-align: left;

    color: #9aaabd;

    font-size: 9px;

    text-transform: uppercase;

    letter-spacing: 1px;

    font-weight: 900;
}

td {
    padding: 14px;

    border-top:
        1px solid rgba(240, 204, 122, 0.045);

    color: #bdc9d4;

    font-size: 11px;

    font-weight: 700;
}

.history-number {
    display: inline-flex;

    align-items: center;

    justify-content: center;

    padding: 5px 10px;

    border-radius: 8px;

    color: var(--cream);

    background:
        linear-gradient(
            145deg,
            #315c80,
            #17364f
        );

    box-shadow:
        0 3px 0 #050e17;

    font-size: 10px;

    font-weight: 900;
}

.numbers-cell {
    color: #d9e0e6;

    font-family:
        "Consolas",
        "Courier New",
        monospace;

    font-size: 11px;

    font-weight: 700;

    line-height: 1.5;
}

.pcs-cell {
    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-width: 30px;

    padding: 5px 8px;

    border-radius: 8px;

    background:
        linear-gradient(
            145deg,
            rgba(93, 204, 139, 0.20),
            rgba(52, 125, 91, 0.08)
        );

    color: #79dda0;

    font-weight: 900;
}

.total-cell {
    color: var(--gold-light);

    font-weight: 900;

    font-size: 12px;
}

/* =========================================================
   EDIT INPUT
========================================================= */

.history-edit-input {
    width: 100%;

    min-width: 85px;

    height: 34px;

    padding: 5px 8px;

    border-radius: 8px;

    border:
        1px solid var(--blue-bright);

    outline: none;

    background:
        linear-gradient(
            145deg,
            #18344f,
            #0a1725
        );

    color: var(--cream-light);

    font-size: 11px;

    font-family:
        "Consolas",
        "Courier New",
        monospace;

    font-weight: 800;

    box-shadow:
        0 0 0 2px
        rgba(77, 155, 211, 0.12);
}

.history-edit-input:focus {
    border-color:
        var(--gold-light);

    box-shadow:
        0 0 0 3px
        rgba(214, 168, 79, 0.15);
}

.history-edit-input::-webkit-inner-spin-button,
.history-edit-input::-webkit-outer-spin-button {
    -webkit-appearance: none;

    margin: 0;
}

.history-edit-input[type="number"] {
    -moz-appearance: textfield;
}

.connected-field {
    opacity: 0.82;

    cursor: not-allowed;

    border-color:
        rgba(93, 204, 139, 0.45);
}

/* =========================================================
   EDIT / SAVE BUTTON
========================================================= */

.action-cell {
    min-width: 95px;

    text-align: center;
}

.edit-history-button,
.save-history-button {
    height: 34px;

    min-width: 72px;

    padding: 6px 10px;

    border-radius: 9px;

    font-size: 10px;

    font-weight: 900;
}

.edit-history-button {
    color: var(--cream);

    background:
        linear-gradient(
            145deg,
            #315c80,
            #17364f
        );

    box-shadow:
        0 4px 0 #050e17,
        0 7px 12px rgba(0, 0, 0, 0.25);
}

.edit-history-button:hover {
    box-shadow:
        0 7px 0 #050e17,
        0 11px 18px rgba(0, 0, 0, 0.35);
}

.save-history-button {
    color: #102319;

    background:
        linear-gradient(
            145deg,
            #7be5a7,
            #3f9b70
        );

    box-shadow:
        0 4px 0 #1b5d40,
        0 7px 12px rgba(0, 0, 0, 0.25);
}

.save-history-button:hover {
    box-shadow:
        0 7px 0 #1b5d40,
        0 11px 18px rgba(0, 0, 0, 0.35);
}

/* =========================================================
   WARNA
========================================================= */

.color-cell {
    min-width: 140px;
}

.color-input {
    width: 125px;

    height: 34px;

    padding: 0 10px;

    border-radius: 9px;

    border:
        1px solid rgba(240, 204, 122, 0.12);

    background:
        linear-gradient(
            145deg,
            #12243a,
            #08131f
        );

    color: var(--cream-light);

    font-size: 11px;

    outline: none;

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.04);

    font-weight: 700;
}

.color-input::placeholder {
    color: #667b90;
}

.color-input:focus {
    border-color:
        var(--gold);

    box-shadow:
        0 0 0 3px
        rgba(214, 168, 79, 0.10);
}

/* =========================================================
   PRINT BUTTON
========================================================= */

.print-history-area {
    margin-top: 18px;

    width: 100%;
}

.print-history-button {
    width: 100%;

    height: 58px;

    border-radius: 15px;

    color: #172231;

    background:
        linear-gradient(
            145deg,
            #fffdf8,
            #f0cc7a 48%,
            #c49a4a
        );

    box-shadow:
        0 7px 0 #806023,
        0 14px 25px rgba(0, 0, 0, 0.28);

    font-size: 13px;

    font-weight: 900;
}

.print-history-button:hover {
    box-shadow:
        0 11px 0 #806023,
        0 20px 32px rgba(0, 0, 0, 0.38);
}

/* =========================================================
   EMPTY
========================================================= */

.empty-history {
    padding: 32px !important;

    text-align: center;

    color: #60748a;

    font-size: 11px;

    font-weight: 700;
}

/* =========================================================
   FOOTER
========================================================= */

.footer {
    margin-top: 20px;

    padding-top: 17px;

    border-top:
        1px solid rgba(240, 204, 122, 0.05);

    text-align: center;

    color: #627487;

    font-size: 10px;
}

.enter-key {
    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-width: 40px;

    padding: 4px 8px;

    margin: 0 4px;

    border-radius: 6px;

    background:
        linear-gradient(
            145deg,
            #20364d,
            #102131
        );

    box-shadow:
        0 3px 0 #040b13;

    color: #aebdca;

    font-family:
        "Consolas",
        monospace;

    font-size: 9px;

    font-weight: 700;
}

/* =========================================================
   TABLET
========================================================= */

@media (max-width: 700px) {

    body {
        padding: 15px;

        align-items: flex-start;

        padding-top: 20px;
    }

    .container {
        padding: 22px;

        border-radius: 27px;
    }

}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    body {
        padding: 9px;

        padding-top: 12px;

        background-attachment: scroll;
    }

    .container {
        width: 100%;

        padding: 17px;

        border-radius: 23px;
    }

    .header {
        align-items: flex-start;

        margin-bottom: 20px;
    }

    .icon {
        width: 44px;

        height: 44px;

        border-radius: 14px;

        font-size: 16px;
    }

    .title {
        gap: 11px;
    }

    .title h1 {
        font-size: 16px;
    }

    .title p {
        font-size: 9px;
    }

    .counter {
        padding: 7px 9px;

        font-size: 9px;
    }

    .input-list {
        max-height: 300px;
    }

    .input-row {
        gap: 8px;

        margin-bottom: 10px;
    }

    .number {
        width: 36px;

        height: 48px;
    }

    .input-wrapper input {
        height: 48px;

        border-radius: 13px;

        padding-left: 14px;

        font-size: 15px;
    }

    .button-area {
        grid-template-columns: 1fr;

        gap: 10px;
    }

    button {
        height: 50px;
    }

    .print-history-button {
        height: 56px;
    }

    .result {
        padding: 17px;

        border-radius: 16px;
    }

    .result strong {
        font-size: 25px;
    }

    .history {
        margin-top: 24px;

        padding-top: 20px;
    }

    .history-header {
        align-items: flex-start;
    }

    .clear-history {
        padding: 7px 9px;
    }

    .color-input {
        width: 110px;

        height: 32px;

        font-size: 10px;
    }

    .history-edit-input {
        min-width: 75px;

        height: 32px;

        font-size: 10px;
    }

    .edit-history-button,
    .save-history-button {
        height: 32px;

        min-width: 68px;

        font-size: 9px;
    }

    .footer {
        font-size: 9px;
    }

}

/* =========================================================
   SMALL PHONE
========================================================= */

@media (max-width: 380px) {

    .container {
        padding: 14px;

        border-radius: 20px;
    }

    .title {
        gap: 8px;
    }

    .icon {
        width: 39px;

        height: 39px;

        font-size: 14px;
    }

    .title h1 {
        font-size: 14px;
    }

    .title p {
        font-size: 8px;
    }

    .counter {
        font-size: 8px;

        padding: 6px 8px;
    }

    .number {
        width: 33px;
    }

}

/* =========================================================
   PRINT
========================================================= */

<body>

<div class="container">

    <div class="header">

        <div class="title">

            <div class="icon">
                SNP
            </div>

            <div>

                <h1>
                    PT SION NIAGA PERKASA
                </h1>

                <p>
                    Silahkan input yard sesuai dengan yang diberikan mandor.
                </p>

            </div>

        </div>

        <div
            class="counter"
            id="counter"
        >
            1 Data
        </div>

    </div>


    <div
        class="input-list"
        id="inputList"
    ></div>


    <div class="button-area">

        <button
            class="add-button"
            onclick="addInput(true)"
        >
            Tambah Kolom
        </button>

        <button
            class="save-button"
            onclick="saveHistory()"
        >
            Simpan ke History
        </button>

    </div>


    <div
        class="result"
        id="result"
    >

        <div class="result-label">

            <span>
                Total Yard
            </span>

            <small>
                Jumlah seluruh angka
            </small>

        </div>

        <strong id="total">
            0
        </strong>

    </div>


    <div class="history">

        <div class="history-header">

            <div class="history-title">

                <h2>
                    History
                </h2>

                <span>
                    Riwayat Input Yard
                </span>

            </div>

            <button
                class="clear-history"
                onclick="clearHistory()"
            >
                Hapus History
            </button>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            No
                        </th>

                        <th>
                            YARD
                        </th>

                        <th>
                            Total PCS
                        </th>

                        <th>
                            Total Yard
                        </th>

                        <th>
                            Warna
                        </th>

                        <th>
                            Aksi
                        </th>

                    </tr>

                </thead>


                <tbody id="historyBody">

                    <tr id="emptyHistory">

                        <td
                            colspan="6"
                            class="empty-history"
                        >
                            Belum ada history
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


        <div class="print-history-area">

            <button
                class="print-history-button"
                onclick="printHistory()"
            >
                🖨 &nbsp; PRINT HISTORY
            </button>

        </div>

    </div>


    <div class="footer">

        Tekan

        <span class="enter-key">
            Enter
        </span>

        untuk menambah kolom berikutnya

    </div>

</div>


<script>

/* =========================================================
   ELEMENT
========================================================= */

const inputList =
    document.getElementById("inputList");

const counter =
    document.getElementById("counter");

const result =
    document.getElementById("result");

const total =
    document.getElementById("total");

const historyBody =
    document.getElementById("historyBody");


/* =========================================================
   VARIABLE
========================================================= */

let number = 0;


/* =========================================================
   ADD INPUT
========================================================= */

function addInput(focusInput = true) {

    number++;

    const row =
        document.createElement("div");

    row.className =
        "input-row";


    row.innerHTML = `

        <div class="number">
            ${number}
        </div>

        <div class="input-wrapper">

            <input
                type="number"
                step="any"
                placeholder="Masukkan yard..."
                autocomplete="off"
            >

            <span class="check">
                ✓
            </span>

        </div>

    `;


    inputList.appendChild(row);


    const input =
        row.querySelector("input");


    input.addEventListener(
        "input",
        function () {

            if (
                this.value.trim() !== ""
            ) {

                this.classList.add("valid");

            } else {

                this.classList.remove("valid");

            }

            calculateTotal();

        }
    );


    input.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key !== "Enter"
            ) {
                return;
            }

            event.preventDefault();


            if (
                this.value.trim() === ""
            ) {
                return;
            }


            const inputs =
                inputList.querySelectorAll(
                    "input"
                );


            const lastInput =
                inputs[
                    inputs.length - 1
                ];


            if (
                this === lastInput
            ) {

                addInput(true);

            } else {

                const index =
                    Array
                        .from(inputs)
                        .indexOf(this);


                if (
                    inputs[index + 1]
                ) {

                    inputs[
                        index + 1
                    ].focus();

                }

            }

        }
    );


    if (focusInput) {

        setTimeout(
            () => input.focus(),
            50
        );

    }


    updateCounter();

}


/* =========================================================
   CALCULATE TOTAL
========================================================= */

function calculateTotal() {

    const inputs =
        inputList.querySelectorAll(
            "input"
        );


    let sum = 0;

    let filled = 0;


    inputs.forEach(
        input => {

            const value =
                parseFloat(
                    input.value
                );


            if (
                !isNaN(value)
            ) {

                sum += value;

                filled++;

            }

        }
    );


    total.textContent =
        formatNumber(sum);


    if (
        filled > 0
    ) {

        result.classList.add("show");

    } else {

        result.classList.remove("show");

    }

}


/* =========================================================
   COUNTER
========================================================= */

function updateCounter() {

    const inputs =
        inputList.querySelectorAll(
            "input"
        );


    counter.textContent =
        `${inputs.length} Data`;

}


/* =========================================================
   SAVE HISTORY
========================================================= */

function saveHistory() {

    const inputs =
        inputList.querySelectorAll(
            "input"
        );


    const values = [];


    inputs.forEach(
        input => {

            if (
                input.value.trim() !== ""
            ) {

                values.push(
                    parseFloat(
                        input.value
                    )
                );

            }

        }
    );


    if (
        values.length === 0
    ) {

        alert(
            "Silakan masukkan angka terlebih dahulu."
        );

        return;

    }


    const totalYard =
        calculateYardTotal(values);


    const totalPCS =
        values.length;


    const empty =
        document.getElementById(
            "emptyHistory"
        );


    if (empty) {
        empty.remove();
    }


    const row =
        document.createElement("tr");


    row.dataset.yards =
        JSON.stringify(values);


    row.innerHTML = `

        <td>

            <span class="history-number">
                0
            </span>

        </td>


        <td>

            <span class="numbers-cell">
                ${formatYardDisplay(values)}
            </span>

        </td>


        <td>

            <span class="pcs-cell">
                ${formatNumber(totalPCS)}
            </span>

        </td>


        <td>

            <span class="total-cell">
                ${formatNumber(totalYard)}
            </span>

        </td>


        <td class="color-cell">

            <input
                type="text"
                class="color-input"
                placeholder="Input warna..."
                autocomplete="off"
            >

        </td>


        <td class="action-cell">

            <button
                type="button"
                class="edit-history-button"
                onclick="editHistory(this)"
            >
                ✎ Edit
            </button>

        </td>

    `;


    historyBody.appendChild(row);


    updateHistoryNumber();

    resetInput();

}


/* =========================================================
   HITUNG TOTAL YARD
========================================================= */

function calculateYardTotal(values) {

    let totalValue = 0;


    values.forEach(
        value => {

            const numberValue =
                Number(value);


            if (
                !isNaN(numberValue)
            ) {

                totalValue +=
                    numberValue;

            }

        }
    );


    return totalValue;

}


/* =========================================================
   FORMAT YARD
========================================================= */

function formatYardDisplay(values) {

    return "(" +
        values
            .map(
                value =>
                    formatNumber(value)
            )
            .join(", ") +
        ")";

}


/* =========================================================
   EDIT HISTORY
========================================================= */

function editHistory(button) {

    const row =
        button.closest("tr");

    if (!row) {
        return;
    }


    if (
        row.classList.contains("editing")
    ) {
        return;
    }


    row.classList.add("editing");


    let yards = [];


    try {

        yards =
            JSON.parse(
                row.dataset.yards || "[]"
            );

    } catch (error) {

        yards = [];

    }


    if (
        yards.length === 0
    ) {

        const yardText =
            row.querySelector(
                ".numbers-cell"
            ).textContent
                .replace(/^\(/, "")
                .replace(/\)$/, "")
                .trim();


        yards =
            parseYardText(yardText);

    }


    const yardCell =
        row.querySelector(
            ".numbers-cell"
        );


    yardCell.innerHTML = `

        <input
            type="text"
            class="history-edit-input yard-edit-input"
            value="${escapeHtmlAttribute(
                yards.join(", ")
            )}"
            autocomplete="off"
            spellcheck="false"
        >

    `;


    const pcsCell =
        row.querySelector(
            ".pcs-cell"
        );


    pcsCell.innerHTML = `

        <input
            type="number"
            class="history-edit-input pcs-edit-input connected-field"
            value="${yards.length}"
            readonly
            title="Total PCS otomatis mengikuti jumlah YARD"
        >

    `;


    const totalCell =
        row.querySelector(
            ".total-cell"
        );


    totalCell.innerHTML = `

        <input
            type="number"
            step="any"
            class="history-edit-input total-yard-edit-input connected-field"
            value="${calculateYardTotal(yards)}"
            readonly
            title="Total Yard otomatis mengikuti jumlah YARD"
        >

    `;


    const yardInput =
        row.querySelector(
            ".yard-edit-input"
        );


    yardInput.addEventListener(
        "input",
        function () {

            updateConnectedHistory(row);

        }
    );


    yardInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                saveEditedHistory(
                    row.querySelector(
                        ".save-history-button"
                    )
                );

            }

        }
    );


    button.className =
        "save-history-button";

    button.innerHTML =
        "✓ Save";

    button.onclick =
        function () {

            saveEditedHistory(this);

        };


    setTimeout(
        () => {

            yardInput.focus();

            yardInput.select();

        },
        50
    );


    updateConnectedHistory(row);

}


/* =========================================================
   UPDATE YARD -> PCS + TOTAL YARD
========================================================= */

function updateConnectedHistory(row) {

    if (!row) {
        return;
    }


    const yardInput =
        row.querySelector(
            ".yard-edit-input"
        );


    const pcsInput =
        row.querySelector(
            ".pcs-edit-input"
        );


    const totalYardInput =
        row.querySelector(
            ".total-yard-edit-input"
        );


    if (
        !yardInput ||
        !pcsInput ||
        !totalYardInput
    ) {
        return;
    }


    const values =
        parseYardText(
            yardInput.value
        );


    const totalPCS =
        values.length;


    const totalYard =
        calculateYardTotal(values);


    pcsInput.value =
        totalPCS;

    totalYardInput.value =
        removeTrailingZeros(totalYard);

}


/* =========================================================
   PARSE YARD TEXT
========================================================= */

function parseYardText(text) {

    if (
        text === null ||
        text === undefined
    ) {
        return [];
    }


    let cleanText =
        String(text)
            .replace(/[()]/g, "")
            .trim();


    if (
        cleanText === ""
    ) {
        return [];
    }


    const parts =
        cleanText.split(
            /[\s,;]+/
        );


    const values = [];


    parts.forEach(
        part => {

            if (
                part === ""
            ) {
                return;
            }


            const normalized =
                part.replace(
                    ",",
                    "."
                );


            const value =
                Number(normalized);


            if (
                !isNaN(value)
            ) {

                values.push(value);

            }

        }
    );


    return values;

}


/* =========================================================
   SAVE EDIT HISTORY
========================================================= */

function saveEditedHistory(button) {

    const row =
        button.closest("tr");

    if (!row) {
        return;
    }


    const yardInput =
        row.querySelector(
            ".yard-edit-input"
        );


    if (!yardInput) {
        return;
    }


    const values =
        parseYardText(
            yardInput.value
        );


    if (
        values.length === 0
    ) {

        alert(
            "YARD tidak boleh kosong."
        );

        yardInput.focus();

        return;

    }


    const totalPCS =
        values.length;


    const totalYard =
        calculateYardTotal(values);


    row.dataset.yards =
        JSON.stringify(values);


    const yardCell =
        row.querySelector(
            ".numbers-cell"
        );


    yardCell.textContent =
        formatYardDisplay(values);


    const pcsCell =
        row.querySelector(
            ".pcs-cell"
        );


    pcsCell.textContent =
        formatNumber(totalPCS);


    const totalCell =
        row.querySelector(
            ".total-cell"
        );


    totalCell.textContent =
        formatNumber(totalYard);


    button.className =
        "edit-history-button";

    button.innerHTML =
        "✎ Edit";

    button.onclick =
        function () {

            editHistory(this);

        };


    row.classList.remove(
        "editing"
    );


    updateHistoryNumber();

}


/* =========================================================
   FORMAT NUMBER
========================================================= */

function formatNumber(value) {

    const numberValue =
        Number(value);


    if (
        isNaN(numberValue)
    ) {

        return "0";

    }


    return numberValue.toLocaleString(
        "id-ID",
        {
            maximumFractionDigits: 10
        }
    );

}


/* =========================================================
   HILANGKAN .000000
========================================================= */

function removeTrailingZeros(value) {

    const numberValue =
        Number(value);


    if (
        isNaN(numberValue)
    ) {
        return "0";
    }


    return String(
        parseFloat(
            numberValue.toFixed(10)
        )
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeHtmlAttribute(value) {

    return escapeHtml(value);

}


/* =========================================================
   UPDATE HISTORY NUMBER
========================================================= */

function updateHistoryNumber() {

    const rows =
        historyBody.querySelectorAll(
            "tr"
        );


    let nomor = 1;


    rows.forEach(
        row => {

            const numberElement =
                row.querySelector(
                    ".history-number"
                );


            if (
                numberElement
            ) {

                numberElement.textContent =
                    nomor;

                nomor++;

            }

        }
    );

}


/* =========================================================
   RESET INPUT
========================================================= */

function resetInput() {

    inputList.innerHTML = "";

    number = 0;

    total.textContent =
        "0";

    result.classList.remove(
        "show"
    );

    addInput(true);

}


/* =========================================================
   PRINT HISTORY
========================================================= */

function printHistory() {

    const editingRows =
        historyBody.querySelectorAll(
            "tr.editing"
        );


    if (
        editingRows.length > 0
    ) {

        alert(
            "Silakan Save perubahan terlebih dahulu sebelum print."
        );

        return;

    }


    window.print();

}


/* =========================================================
   CLEAR HISTORY
========================================================= */

function clearHistory() {

    const rows =
        historyBody.querySelectorAll(
            "tr:not(#emptyHistory)"
        );


    if (
        rows.length > 0
    ) {

        const confirmation =
            confirm(
                "Apakah Anda yakin ingin menghapus semua history?"
            );


        if (!confirmation) {
            return;
        }

    }


    historyBody.innerHTML = `

        <tr id="emptyHistory">

            <td
                colspan="6"
                class="empty-history"
            >
                Belum ada history
            </td>

        </tr>

    `;

}


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key !== "Escape"
        ) {
            return;
        }


        const editingRows =
            historyBody.querySelectorAll(
                "tr.editing"
            );


        if (
            editingRows.length === 0
        ) {
            return;
        }


        const cancel =
            confirm(
                "Batalkan perubahan pada history?"
            );


        if (!cancel) {
            return;
        }


        editingRows.forEach(
            row => {

                const yardInput =
                    row.querySelector(
                        ".yard-edit-input"
                    );


                if (!yardInput) {
                    return;
                }


                let savedYards = [];


                try {

                    savedYards =
                        JSON.parse(
                            row.dataset.yards ||
                            "[]"
                        );

                } catch (error) {

                    savedYards = [];

                }


                if (
                    savedYards.length === 0
                ) {
                    return;
                }


                const yardCell =
                    row.querySelector(
                        ".numbers-cell"
                    );

                const pcsCell =
                    row.querySelector(
                        ".pcs-cell"
                    );

                const totalCell =
                    row.querySelector(
                        ".total-cell"
                    );


                yardCell.textContent =
                    formatYardDisplay(
                        savedYards
                    );


                pcsCell.textContent =
                    formatNumber(
                        savedYards.length
                    );


                totalCell.textContent =
                    formatNumber(
                        calculateYardTotal(
                            savedYards
                        )
                    );


                const button =
                    row.querySelector(
                        ".save-history-button"
                    );


                if (button) {

                    button.className =
                        "edit-history-button";

                    button.innerHTML =
                        "✎ Edit";

                    button.onclick =
                        function () {

                            editHistory(this);

                        };

                }


                row.classList.remove(
                    "editing"
                );

            }
        );

    }
);


/* =========================================================
   START
========================================================= */

addInput(true);

</script>

</body>
</html>
