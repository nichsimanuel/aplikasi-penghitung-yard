<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Yard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #dfe9df;
      color: #193d2b;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 25px;
      border-radius: 25px;
      background: #eef5ee;
      box-shadow:
        10px 10px 25px rgba(0, 0, 0, 0.12),
        -10px -10px 25px rgba(255, 255, 255, 0.8);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
      color: #1b5135;
    }

    .header p {
      margin-top: 8px;
      color: #557260;
      font-weight: 600;
    }

    .input-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .input-item {
      position: relative;
    }

    .input-item label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 800;
      color: #355d45;
    }

    .yard-input {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      outline: none;
      background: #edf4ed;
      color: #193d2b;
      font-size: 16px;
      font-weight: 700;
      box-shadow:
        inset 4px 4px 8px rgba(0, 0, 0, 0.08),
        inset -4px -4px 8px rgba(255, 255, 255, 0.8);
      transition: 0.2s ease;
    }

    .yard-input:focus {
      box-shadow:
        inset 2px 2px 5px rgba(0, 0, 0, 0.12),
        inset -2px -2px 5px rgba(255, 255, 255, 0.9),
        0 0 0 2px #6ca67d;
    }

    .button-area {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 14px;
      padding: 13px 22px;
      font-size: 15px;
      font-weight: 800;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-4px) scale(1.02);
    }

    button:active {
      transform: translateY(1px) scale(0.98);
    }

    .add-button {
      background: #d5e6d8;
      color: #215638;
      box-shadow:
        5px 5px 12px rgba(0, 0, 0, 0.12),
        -5px -5px 12px rgba(255, 255, 255, 0.8);
    }

    .save-button {
      background: #276c45;
      color: white;
      box-shadow:
        5px 5px 12px rgba(0, 0, 0, 0.18),
        -5px -5px 12px rgba(255, 255, 255, 0.6);
    }

    .result {
      text-align: center;
      margin: 20px 0 30px;
      padding: 18px;
      border-radius: 15px;
      background: #dcebdc;
      color: #174b2e;
      font-size: 20px;
      font-weight: 800;
      box-shadow:
        inset 3px 3px 7px rgba(0, 0, 0, 0.08),
        inset -3px -3px 7px rgba(255, 255, 255, 0.8);
    }

    .history {
      margin-top: 25px;
    }

    .history-header {
      margin-bottom: 15px;
      font-size: 22px;
      font-weight: 900;
      color: #1d5135;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border-radius: 15px;
    }

    table {
      width: 100%;
      min-width: 700px;
      border-collapse: collapse;
      background: #f5f9f5;
      overflow: hidden;
      border-radius: 15px;
    }

    th,
    td {
      border: 1px solid #aac2ad;
      padding: 10px;
      text-align: center;
      vertical-align: middle;
    }

    th {
      background: #276c45;
      color: white;
      font-weight: 900;
    }

    td {
      color: #214832;
      font-weight: 800;
    }

    .numbers-cell {
      display: block;
      width: 100%;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
      text-align: left;
      line-height: 1.5;
    }

    .yard-edit {
      width: 100%;
      min-height: 55px;
      resize: vertical;
      padding: 8px;
      border: 1px solid #a7c0ad;
      border-radius: 8px;
      outline: none;
      background: white;
      color: #193d2b;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.5;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .yard-edit:focus {
      border-color: #276c45;
      box-shadow: 0 0 0 2px rgba(39, 108, 69, 0.15);
    }

    .total-cell {
      font-weight: 900;
      white-space: nowrap;
    }

    .color-input {
      width: 100%;
      max-width: 150px;
      padding: 8px;
      border: 1px solid #a7c0ad;
      border-radius: 8px;
      outline: none;
      text-align: center;
      font-weight: 800;
      color: #193d2b;
      background: white;
    }

    .print-history-area {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .print-history-button {
      min-width: 220px;
      padding: 16px 25px;
      background: #1d5135;
      color: white;
      font-size: 16px;
      font-weight: 900;
      box-shadow:
        6px 6px 15px rgba(0, 0, 0, 0.18),
        -5px -5px 12px rgba(255, 255, 255, 0.6);
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      font-size: 12px;
      color: #718879;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 15px;
        border-radius: 18px;
      }

      .header h1 {
        font-size: 24px;
      }

      .input-list {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .button-area {
        flex-direction: column;
      }

      .button-area button {
        width: 100%;
      }

      table {
        min-width: 650px;
      }
    }

    /* =========================================================
       PRINT
       HANYA BAGIAN HISTORY YANG DICETAK
       ========================================================= */
    @media print {

      @page {
        size: A4 landscape;
        margin: 10mm;
      }

      html,
      body {
        width: 100%;
        height: auto;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
      }

      body {
        color: #000 !important;
      }

      /* Sembunyikan semua bagian */
      .header,
      .input-list,
      .button-area,
      .result,
      .footer,
      .print-history-area {
        display: none !important;
      }

      /* Container hanya menjadi pembungkus */
      .container {
        display: block !important;
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        box-shadow: none !important;
        border-radius: 0 !important;
      }

      /* Hanya history yang muncul */
      .history {
        display: block !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        box-shadow: none !important;
        border: none !important;
      }

      .history-header {
        display: block !important;
        margin: 0 0 12px 0 !important;
        padding: 0 !important;
        text-align: center !important;
        color: #000 !important;
        font-size: 22px !important;
        font-weight: 900 !important;
      }

      .table-wrapper {
        display: block !important;
        width: 100% !important;
        overflow: visible !important;
      }

      table {
        width: 100% !important;
        min-width: 0 !important;
        table-layout: fixed !important;
        border-collapse: collapse !important;
        background: #fff !important;
        color: #000 !important;
        border-radius: 0 !important;
      }

      thead {
        display: table-header-group !important;
      }

      tr {
        page-break-inside: avoid !important;
      }

      th,
      td {
        border: 1px solid #000 !important;
        background: #fff !important;
        color: #000 !important;
        padding: 7px !important;
        font-weight: 800 !important;
        vertical-align: middle !important;
      }

      th {
        background: #eaeaea !important;
        color: #000 !important;
        text-align: center !important;
        font-weight: 900 !important;
      }

      /* Lebar kolom */
      th:nth-child(1),
      td:nth-child(1) {
        width: 7% !important;
        text-align: center !important;
      }

      th:nth-child(2),
      td:nth-child(2) {
        width: 43% !important;
        text-align: left !important;
      }

      th:nth-child(3),
      td:nth-child(3) {
        width: 15% !important;
        text-align: center !important;
      }

      th:nth-child(4),
      td:nth-child(4) {
        width: 17% !important;
        text-align: center !important;
      }

      th:nth-child(5),
      td:nth-child(5) {
        width: 18% !important;
        text-align: center !important;
      }

      /*
       * YARD:
       * Saat print textarea dibuat transparan
       * agar isi YARD tetap terlihat seperti teks.
       */
      .yard-edit {
        display: block !important;
        width: 100% !important;
        min-height: 0 !important;
        height: auto !important;
        resize: none !important;
        overflow: visible !important;
        border: none !important;
        outline: none !important;
        border-radius: 0 !important;
        background: transparent !important;
        color: #000 !important;
        padding: 0 !important;
        margin: 0 !important;
        font-family: Arial, Helvetica, sans-serif !important;
        font-size: 11px !important;
        font-weight: 800 !important;
        line-height: 1.4 !important;
        white-space: pre-wrap !important;
        overflow-wrap: anywhere !important;
        word-break: break-word !important;
      }

      .numbers-cell {
        display: block !important;
        width: 100% !important;
        color: #000 !important;
        font-weight: 800 !important;
        white-space: normal !important;
        overflow-wrap: anywhere !important;
        word-break: break-word !important;
      }

      .total-cell {
        color: #000 !important;
        font-weight: 900 !important;
      }

      /*
       * Warna selalu berada di tengah
       */
      .color-input {
        display: block !important;
        width: 100% !important;
        max-width: none !important;
        border: none !important;
        outline: none !important;
        border-radius: 0 !important;
        background: transparent !important;
        color: #000 !important;
        text-align: center !important;
        font-weight: 800 !important;
        padding: 0 !important;
        margin: 0 auto !important;
      }

      /* Hilangkan spinner/input decoration */
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>INPUT YARD</h1>
      <p>Masukkan data yard dan simpan ke history</p>
    </div>

    <div class="input-list" id="inputList"></div>

    <div class="button-area">
      <button
        class="add-button"
        type="button"
        onclick="addInput(true)">
        ＋ Tambah Kolom
      </button>

      <button
        class="save-button"
        type="button"
        onclick="saveHistory()">
        ✓ Simpan ke History
      </button>
    </div>

    <div class="result" id="result">
      Total Yard: 0
    </div>

    <div class="history">

      <div class="history-header">
        HISTORY
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>YARD</th>
              <th>Total PCS</th>
              <th>Total Yard</th>
              <th>Warna</th>
            </tr>
          </thead>

          <tbody id="historyBody">
          </tbody>
        </table>
      </div>

      <div class="print-history-area">
        <button
          class="print-history-button"
          type="button"
          onclick="printHistory()">
          🖨 PRINT HISTORY
        </button>
      </div>

    </div>

    <div class="footer">
      Input Yard System
    </div>

  </div>

  <script>
    let inputCount = 0;

    /*
     * =========================================================
     * TAMBAH INPUT
     * =========================================================
     */
    function addInput(focusInput = true) {
      inputCount++;

      const inputList = document.getElementById("inputList");

      const wrapper = document.createElement("div");
      wrapper.className = "input-item";

      const label = document.createElement("label");
      label.textContent = "YARD " + inputCount;

      const input = document.createElement("input");
      input.type = "number";
      input.step = "any";
      input.min = "0";
      input.className = "yard-input";
      input.placeholder = "0";
      input.setAttribute("data-index", inputCount);

      input.addEventListener("input", calculateTotal);

      input.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          event.preventDefault();

          const inputs =
            Array.from(document.querySelectorAll(".yard-input"));

          const currentIndex = inputs.indexOf(input);

          if (currentIndex === inputs.length - 1) {
            addInput(true);
          } else {
            inputs[currentIndex + 1].focus();
          }
        }
      });

      wrapper.appendChild(label);
      wrapper.appendChild(input);

      inputList.appendChild(wrapper);

      if (focusInput) {
        setTimeout(() => {
          input.focus();
        }, 50);
      }

      calculateTotal();
    }

    /*
     * =========================================================
     * HITUNG TOTAL INPUT
     * =========================================================
     */
    function calculateTotal() {
      const inputs =
        document.querySelectorAll(".yard-input");

      let total = 0;

      inputs.forEach(input => {
        const value = parseFloat(input.value);

        if (!isNaN(value)) {
          total += value;
        }
      });

      document.getElementById("result").textContent =
        "Total Yard: " +
        formatNumber(total);
    }

    /*
     * =========================================================
     * FORMAT ANGKA
     * =========================================================
     */
    function formatNumber(number) {
      return number.toLocaleString("id-ID", {
        maximumFractionDigits: 2
      });
    }

    /*
     * =========================================================
     * SIMPAN HISTORY
     * =========================================================
     */
    function saveHistory() {

      const inputs =
        Array.from(document.querySelectorAll(".yard-input"));

      const values = inputs
        .map(input => parseFloat(input.value))
        .filter(value => !isNaN(value));

      if (values.length === 0) {
        alert("Silakan masukkan yard terlebih dahulu.");
        return;
      }

      const total = values.reduce(
        (sum, value) => sum + value,
        0
      );

      const historyBody =
        document.getElementById("historyBody");

      const row = document.createElement("tr");

      /*
       * NOMOR
       */
      const noCell = document.createElement("td");
      noCell.textContent = historyBody.children.length + 1;

      /*
       * YARD EDITABLE
       */
      const yardCell = document.createElement("td");

      const yardEdit = document.createElement("textarea");
      yardEdit.className = "yard-edit";

      yardEdit.value = values
        .map(value => formatNumber(value))
        .join(", ");

      yardEdit.setAttribute(
        "aria-label",
        "Edit nilai yard"
      );

      yardEdit.addEventListener("input", function() {
        updateHistoryRow(row);
        autoResizeTextarea(yardEdit);
      });

      yardCell.appendChild(yardEdit);

      /*
       * TOTAL PCS
       */
      const pcsCell = document.createElement("td");
      pcsCell.className = "total-cell";

      /*
       * TOTAL YARD
       */
      const totalCell = document.createElement("td");
      totalCell.className = "total-cell";

      /*
       * WARNA
       */
      const colorCell = document.createElement("td");

      const colorInput = document.createElement("input");
      colorInput.type = "text";
      colorInput.className = "color-input";
      colorInput.placeholder = "Warna";

      colorCell.appendChild(colorInput);

      row.appendChild(noCell);
      row.appendChild(yardCell);
      row.appendChild(pcsCell);
      row.appendChild(totalCell);
      row.appendChild(colorCell);

      historyBody.appendChild(row);

      updateHistoryRow(row);
      autoResizeTextarea(yardEdit);

      /*
       * Reset input utama
       */
      resetInputs();
    }

    /*
     * =========================================================
     * PARSE YARD DARI HISTORY
     *
     * Bisa membaca:
     * 10, 20, 30
     * 10 20 30
     * 10.5, 20.5
     * =========================================================
     */
    function parseYardValues(text) {

      if (!text || !text.trim()) {
        return [];
      }

      /*
       * Ganti beberapa karakter pemisah
       * menjadi spasi.
       */
      const cleaned = text
        .replace(/\n/g, " ")
        .replace(/;/g, " ")
        .replace(/\|/g, " ");

      /*
       * Cari semua angka.
       *
       * Mendukung:
       * 10
       * 10.5
       * 10,5
       */
      const matches = cleaned.match(
        /-?\d+(?:[.,]\d+)?/g
      );

      if (!matches) {
        return [];
      }

      return matches
        .map(value => {
          /*
           * Jika angka menggunakan koma desimal,
           * ubah menjadi titik.
           */
          return parseFloat(
            value.replace(",", ".")
          );
        })
        .filter(value => !isNaN(value));
    }

    /*
     * =========================================================
     * UPDATE SATU BARIS HISTORY
     * =========================================================
     */
    function updateHistoryRow(row) {

      const yardEdit =
        row.querySelector(".yard-edit");

      const values =
        parseYardValues(yardEdit.value);

      const total =
        values.reduce(
          (sum, value) => sum + value,
          0
        );

      const pcsCell =
        row.querySelectorAll("td")[2];

      const totalCell =
        row.querySelectorAll("td")[3];

      pcsCell.textContent =
        values.length;

      totalCell.textContent =
        formatNumber(total);

      updateHistoryNumbers();
    }

    /*
     * =========================================================
     * UPDATE NOMOR HISTORY
     * =========================================================
     */
    function updateHistoryNumbers() {

      const rows =
        document.querySelectorAll(
          "#historyBody tr"
        );

      rows.forEach((row, index) => {
        row.children[0].textContent =
          index + 1;
      });
    }

    /*
     * =========================================================
     * RESET INPUT
     * =========================================================
     */
    function resetInputs() {

      const inputList =
        document.getElementById("inputList");

      inputList.innerHTML = "";

      inputCount = 0;

      /*
       * Buat satu input kosong lagi
       */
      addInput(false);

      calculateTotal();
    }

    /*
     * =========================================================
     * AUTO RESIZE TEXTAREA
     * =========================================================
     */
    function autoResizeTextarea(textarea) {

      textarea.style.height = "auto";

      /*
       * Pada layar biasa textarea mengikuti isi.
       */
      textarea.style.height =
        textarea.scrollHeight + "px";
    }

    /*
     * =========================================================
     * PRINT HISTORY
     * =========================================================
     *
     * CSS @media print di atas memastikan:
     * - Header tidak dicetak
     * - Input tidak dicetak
     * - Tombol tidak dicetak
     * - Total input tidak dicetak
     * - Footer tidak dicetak
     * - HANYA HISTORY yang dicetak
     */
    function printHistory() {

      const rows =
        document.querySelectorAll(
          "#historyBody tr"
        );

      if (rows.length === 0) {
        alert("History masih kosong.");
        return;
      }

      /*
       * Pastikan semua total sudah diperbarui
       * sebelum print.
       */
      rows.forEach(row => {
        updateHistoryRow(row);
      });

      /*
       * Beri sedikit waktu agar browser
       * menyelesaikan rendering.
       */
      setTimeout(() => {
        window.print();
      }, 100);
    }

    /*
     * =========================================================
     * INITIAL INPUT
     * =========================================================
     */
    addInput(false);

  </script>

</body>
</html>
