<!DOCTYPE html> 
<html lang="id"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
 
<title>PT SION NIAGA PERKASA</title> 
 
<style> 
 
*{ 
    box-sizing:border-box; 
    margin:0; 
    padding:0; 
    font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif 
} 
 
:root{ 
    --ink:#26344d; 
    --muted:#71839a; 
    --white:#fff; 
    --blue:#58b9ee; 
    --blue-dark:#3187bd; 
    --sky:#e8f8ff; 
    --yellow:#ffd75a; 
    --yellow-dark:#d49d24; 
    --orange:#ff9b4a; 
    --orange-dark:#dc7130; 
    --pink:#ff91ad; 
    --pink-dark:#d96887; 
    --green:#72d79b; 
    --green-dark:#4aa86f; 
    --purple:#a996ff; 
    --shadow:rgba(38,52,77,.20) 
} 
 
html{ 
    scroll-behavior:smooth 
} 
 
body{ 
    min-height:100vh; 
    display:flex; 
    justify-content:center; 
    align-items:center; 
    padding:24px; 
    color:var(--ink); 
    overflow-x:hidden; 
    position:relative; 
    background: 
        radial-gradient(circle at 7% 12%,#fff 0 34px,transparent 35px), 
        radial-gradient(circle at 92% 13%,#fff7bd 0 27px,transparent 28px), 
        radial-gradient(circle at 9% 88%,#d9f8e7 0 42px,transparent 43px), 
        linear-gradient(135deg,#8edbff 0%,#e9faff 47%,#fff0bb 100%); 
} 
 
body::before{ 
    content:""; 
    position:fixed; 
    inset:0; 
    pointer-events:none; 
    background: 
        radial-gradient(circle at 18% 20%,rgba(255,255,255,.7) 0 4px,transparent 5px), 
        radial-gradient(circle at 82% 35%,rgba(255,255,255,.65) 0 5px,transparent 6px), 
        radial-gradient(circle at 15% 70%,rgba(255,255,255,.6) 0 3px,transparent 4px), 
        radial-gradient(circle at 88% 78%,rgba(255,255,255,.7) 0 4px,transparent 5px); 
} 
 
.container{ 
    width:780px; 
    max-width:100%; 
    position:relative; 
    padding:29px; 
    border-radius:36px; 
    background:rgba(255,255,255,.95); 
    border:4px solid #fff; 
    box-shadow: 
        0 11px 0 #78a9c0, 
        0 28px 55px var(--shadow), 
        inset 0 0 0 3px #d7f2fb; 
    backdrop-filter:blur(10px); 
} 
 
.header{ 
    display:flex; 
    justify-content:space-between; 
    align-items:center; 
    gap:15px; 
    margin-bottom:25px; 
} 
 
.title{ 
    display:flex; 
    align-items:center; 
    gap:14px; 
} 
 
.icon{ 
    width:62px; 
    height:62px; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    flex-shrink:0; 
    border-radius:20px; 
    color:#fff; 
    font-size:15px; 
    font-weight:1000; 
    letter-spacing:.5px; 
    background:linear-gradient(145deg,#ffbd61,#ff8848); 
    border:4px solid #fff; 
    box-shadow: 
        0 7px 0 var(--orange-dark), 
        0 12px 20px rgba(255,136,72,.25); 
    transform:none; 
    position:relative; 
} 
 
.title h1{ 
    font-size:21px; 
    font-weight:1000; 
    color:var(--ink); 
    letter-spacing:.2px; 
} 
 
.title p{ 
    margin-top:5px; 
    color:var(--muted); 
    font-size:11px; 
    font-weight:800; 
} 
 
.data-counter{ 
    position:relative; 
    flex-shrink:0; 
    min-width:100px; 
    padding:10px 14px; 
    border-radius:18px; 
    background:linear-gradient(145deg,#ffffff,#eef8fc); 
    border:3px solid #d9eef7; 
    box-shadow: 
        0 5px 0 #9fc9da, 
        0 9px 18px rgba(49,135,189,.14); 
    text-align:center; 
    overflow:hidden; 
    transition: 
        transform .2s, 
        box-shadow .2s, 
        background .2s, 
        border-color .2s; 
} 
 
.data-counter::before{ 
    content:""; 
    position:absolute; 
    top:0; 
    left:0; 
    right:0; 
    height:4px; 
    background:linear-gradient( 
        90deg, 
        #58b9ee, 
        #72d79b, 
        #ffd75a 
    ); 
} 
 
.data-counter-label{ 
    display:block; 
    margin-top:2px; 
    color:#7893a5; 
    font-size:8px; 
    font-weight:1000; 
    text-transform:uppercase; 
    letter-spacing:1.3px; 
} 
 
.data-counter-value{ 
    display:block; 
    margin-top:3px; 
    color:#4d7e99; 
    font-size:22px; 
    line-height:1; 
    font-weight:1000; 
    transition:.2s; 
} 
 
.data-counter.active{ 
    background:linear-gradient(145deg,#f0fff7,#dcf7e8); 
    border-color:#bfe8cf; 
    box-shadow: 
        0 5px 0 #83bd9d, 
        0 10px 20px rgba(74,168,111,.17); 
    transform:translateY(-1px); 
} 
 
.data-counter.active .data-counter-label{ 
    color:#5f8f72; 
} 
 
.data-counter.active .data-counter-value{ 
    color:#3fa36b; 
} 
 
.input-list{ 
    max-height:325px; 
    overflow-y:auto; 
    padding:6px 7px 6px 3px; 
    scrollbar-width:thin; 
    scrollbar-color:#78c7ec transparent; 
} 
 
.input-list::-webkit-scrollbar{ 
    width:8px 
} 
 
.input-list::-webkit-scrollbar-thumb{ 
    background:#78c7ec; 
    border-radius:20px; 
    border:2px solid #e8f8ff 
} 
 
.input-row{ 
    display:flex; 
    align-items:center; 
    gap:12px; 
    margin-bottom:14px; 
    animation:inputAppear .3s cubic-bezier(.2,.8,.2,1); 
} 
 
@keyframes inputAppear{ 
    from{ 
        opacity:0; 
        transform:translateY(15px) scale(.97) rotate(-1deg) 
    } 
 
    to{ 
        opacity:1; 
        transform:translateY(0) scale(1) rotate(0) 
    } 
} 
 
.number{ 
    width:45px; 
    height:53px; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    flex-shrink:0; 
    border-radius:16px; 
    background:#e1f6ff; 
    border:3px solid #fff; 
    color:#39749a; 
    font-size:12px; 
    font-weight:1000; 
    box-shadow:0 5px 0 #8dc1d9; 
    transform:rotate(-2deg); 
} 
 
.input-wrapper{ 
    position:relative; 
    flex:1 
} 
 
.input-wrapper input{ 
    width:100%; 
    height:53px; 
    border:3px solid #c7eaf8; 
    border-radius:18px; 
    background:#fff; 
    color:var(--ink); 
    padding:0 52px 0 18px; 
    font-size:16px; 
    font-weight:800; 
    outline:none; 
    transition:.2s; 
    box-shadow:0 5px 0 #b7d5e1; 
} 
 
.input-wrapper input:hover{ 
    border-color:#9fd9f2 
} 
 
.input-wrapper input:focus{ 
    border-color:#ffc857; 
    background:#fffdf1; 
    box-shadow: 
        0 5px 0 #d8a943, 
        0 0 0 5px rgba(255,200,87,.16); 
} 
 
.input-wrapper input::placeholder{ 
    color:#a2b1be 
} 
 
.input-wrapper input::-webkit-inner-spin-button, 
.input-wrapper input::-webkit-outer-spin-button{ 
    -webkit-appearance:none; 
    margin:0 
} 
 
.input-wrapper input[type=number]{ 
    -moz-appearance:textfield 
} 
 
.delete-input-button{ 
    width:42px; 
    height:53px; 
    flex-shrink:0; 
    border-radius:15px; 
    color:#fff; 
    background:linear-gradient(145deg,#ff8fa7,#e96582); 
    box-shadow: 
        0 5px 0 #c94e69, 
        0 8px 15px rgba(233,101,130,.18); 
    font-size:16px; 
    font-weight:1000; 
} 
 
.delete-input-button:hover{ 
    box-shadow: 
        0 7px 0 #c94e69, 
        0 11px 18px rgba(233,101,130,.24); 
} 
 
.delete-input-button:disabled{ 
    opacity:.45; 
    cursor:not-allowed; 
    transform:none; 
    filter:none; 
} 
 
.check{ 
    position:absolute; 
    right:15px; 
    top:50%; 
    transform:translateY(-50%) scale(.5) rotate(-15deg); 
    width:25px; 
    height:25px; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    border-radius:50%; 
    background:var(--green); 
    border:3px solid #fff; 
    color:#fff; 
    font-size:12px; 
    font-weight:1000; 
    opacity:0; 
    transition:.22s; 
    box-shadow:0 3px 0 var(--green-dark); 
} 
 
.input-wrapper input.valid + .check{ 
    opacity:1; 
    transform:translateY(-50%) scale(1) rotate(0) 
} 
 
.button-area{ 
    display:grid; 
    grid-template-columns:1fr 1fr; 
    gap:13px; 
    margin-top:13px 
} 
 
button{ 
    height:53px; 
    border:none; 
    border-radius:17px; 
    cursor:pointer; 
    font-size:12px; 
    font-weight:1000; 
    transition: 
        transform .18s, 
        box-shadow .18s, 
        filter .18s; 
} 
 
button:hover{ 
    transform:translateY(-4px) rotate(-.4deg); 
    filter:brightness(1.04) 
} 
 
button:active{ 
    transform:translateY(2px) scale(.98) 
} 
 
.save-button{ 
    color:#704c00; 
    background:linear-gradient(145deg,#ffed93,#ffc857); 
    box-shadow: 
        0 7px 0 #d39d2c, 
        0 11px 19px rgba(255,200,87,.25); 
} 
 
.save-button:hover{ 
    box-shadow: 
        0 10px 0 #d39d2c, 
        0 17px 26px rgba(255,200,87,.3) 
} 
 
.reset-button{ 
    color:#7b4d00; 
    background:linear-gradient(145deg,#ffd6d6,#ff9fb0); 
    box-shadow: 
        0 7px 0 #d86f82, 
        0 11px 19px rgba(216,111,130,.22); 
} 
 
.reset-button:hover{ 
    box-shadow: 
        0 10px 0 #d86f82, 
        0 17px 26px rgba(216,111,130,.28); 
} 
 
.save-button:disabled, 
.reset-button:disabled, 
.clear-history:disabled{ 
    opacity:.45; 
    cursor:not-allowed; 
    transform:none!important; 
    filter:grayscale(.35); 
} 
 
.save-button:disabled{ 
    box-shadow:0 5px 0 #d39d2c!important; 
} 
 
.reset-button:disabled{ 
    box-shadow:0 5px 0 #d86f82!important; 
} 
 
.clear-history:disabled{ 
    box-shadow:0 4px 0 #e8a1af!important; 
} 
 
.save-button:disabled:hover, 
.reset-button:disabled:hover, 
.clear-history:disabled:hover{ 
    transform:none!important; 
    filter:grayscale(.35); 
} 
 
.yard-header{ 
    font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif; 
    font-weight:1000; 
    letter-spacing:1.2px; 
    font-size:10px; 
} 
 
.result{ 
    display:none; 
    margin-top:18px; 
    padding:20px 22px; 
    border-radius:21px; 
    background:#f2fcff; 
    border:3px solid #bce8f8; 
    box-shadow: 
        0 7px 0 #9cc8dc, 
        0 13px 23px rgba(37,50,74,.1); 
} 
 
.result.show{ 
    display:flex; 
    justify-content:space-between; 
    align-items:center 
} 
 
.result-label{ 
    display:flex; 
    flex-direction:column; 
    gap:4px 
} 
 
.result-label span{ 
    color:#56819a; 
    font-size:10px; 
    text-transform:uppercase; 
    letter-spacing:1.5px; 
    font-weight:1000 
} 
 
.result-label small{ 
    color:#8aa0b1; 
    font-size:10px 
} 
 
.result strong{ 
    color:#f09a27; 
    font-size:30px; 
    font-weight:1000; 
    text-shadow:0 2px 0 #ffe0a1 
} 
 
.history{ 
    margin-top:30px; 
    padding-top:24px; 
    border-top:3px dashed #cfeaf5; 
    font-weight:700 
} 
 
.history-header{ 
    display:flex; 
    justify-content:space-between; 
    align-items:center; 
    gap:15px; 
    margin-bottom:15px 
} 
 
.history-title h2{ 
    font-size:16px; 
    font-weight:1000; 
    color:var(--ink) 
} 
 
.history-title span{ 
    display:block; 
    margin-top:4px; 
    color:#8193a6; 
    font-size:10px; 
    font-weight:800 
} 
 
.clear-history{ 
    height:auto; 
    padding:8px 12px; 
    border-radius:11px; 
    color:#a45261; 
    background:#fff0f3; 
    border:2px solid #ffc4cf; 
    box-shadow:0 4px 0 #e8a1af; 
    font-size:10px; 
    font-weight:1000; 
} 
 
.clear-history:hover{ 
    box-shadow:0 6px 0 #e8a1af 
} 
 
.table-wrapper{ 
    width:100%; 
    max-width:100%; 
    overflow-x:hidden; 
    overflow-y:visible; 
    border-radius:21px; 
    border:3px solid #cceaf6; 
    background:#fff; 
    box-shadow: 
        0 7px 0 #9fc9da, 
        0 13px 23px rgba(37,50,74,.12); 
} 
 
table{ 
    width:100%; 
    max-width:100%; 
    min-width:0; 
    table-layout:fixed; 
    border-collapse:collapse; 
} 
 
thead{ 
    background:linear-gradient(145deg,#e3f7ff,#c6ebfa) 
} 
 
th{ 
    padding:12px 7px; 
    text-align:center; 
    color:#47728d; 
    font-size:9px; 
    text-transform:uppercase; 
    letter-spacing:.5px; 
    font-weight:1000; 
    overflow-wrap:anywhere; 
    word-break:break-word; 
} 
 
td{ 
    padding:12px 7px; 
    border-top:2px dashed #e0eff5; 
    color:#5c7084; 
    font-size:11px; 
    font-weight:800; 
    vertical-align:middle; 
    overflow-wrap:anywhere; 
    word-break:break-word; 
} 
 
th:nth-child(1), 
td:nth-child(1){ 
    width:7%; 
    text-align:center; 
} 
 
th:nth-child(2), 
td:nth-child(2){ 
    width:35%; 
} 
 
th:nth-child(3), 
td:nth-child(3){ 
    width:13%; 
    text-align:center; 
} 
 
th:nth-child(4), 
td:nth-child(4){ 
    width:15%; 
    text-align:center; 
} 
 
th:nth-child(5), 
td:nth-child(5){ 
    width:17%; 
} 
 
th:nth-child(6), 
td:nth-child(6){ 
    width:13%; 
    text-align:center; 
} 
 
.history-number{ 
    display:inline-flex; 
    align-items:center; 
    justify-content:center; 
    padding:5px 8px; 
    min-width:28px; 
    max-width:100%; 
    border-radius:10px; 
    color:#fff; 
    background:#69b8e5; 
    box-shadow:0 3px 0 #438db6; 
    font-size:10px; 
    font-weight:1000; 
} 
 
.numbers-cell{ 
    display:block; 
    width:100%; 
    max-width:100%; 
    color:#425a70; 
    font-family:"Consolas","Courier New",monospace; 
    font-size:11px; 
    font-weight:800; 
    line-height:1.5; 
    white-space:normal; 
    overflow-wrap:anywhere; 
    word-break:break-word; 
} 
 
.pcs-cell{ 
    display:inline-flex; 
    align-items:center; 
    justify-content:center; 
    min-width:30px; 
    max-width:100%; 
    padding:5px 7px; 
    border-radius:9px; 
    background:#e5f8ed; 
    color:#42a56e; 
    border:2px solid #bde8ce; 
    font-weight:1000; 
} 
 
.total-cell{ 
    color:#e89a25; 
    font-weight:1000; 
    font-size:12px; 
    overflow-wrap:anywhere; 
    word-break:break-word; 
} 
 
.history-edit-input{ 
    display:block; 
    width:100%; 
    max-width:100%; 
    min-width:0; 
    height:34px; 
    padding:5px 6px; 
    border-radius:9px; 
    border:2px solid #69b8e5; 
    outline:none; 
    background:#f7fdff; 
    color:var(--ink); 
    font-size:11px; 
    font-family:"Consolas","Courier New",monospace; 
    font-weight:800; 
    box-shadow:0 0 0 3px rgba(105,184,229,.1); 
} 
 
.history-edit-input:focus{ 
    border-color:#ffc857; 
    box-shadow:0 0 0 3px rgba(255,200,87,.16) 
} 
 
.history-edit-input::-webkit-inner-spin-button, 
.history-edit-input::-webkit-outer-spin-button{ 
    -webkit-appearance:none; 
    margin:0 
} 
 
.history-edit-input[type=number]{ 
    -moz-appearance:textfield 
} 
 
.connected-field{ 
    opacity:.82; 
    cursor:not-allowed; 
    border-color:#8bd1a9 
} 
 
.action-cell{ 
    min-width:0; 
    width:100%; 
    text-align:center 
} 
 
.edit-history-button, 
.save-history-button, 
.delete-history-button{ 
    width:100%; 
    max-width:100%; 
    height:34px; 
    min-width:0; 
    padding:6px 5px; 
    border-radius:10px; 
    font-size:10px; 
    font-weight:1000; 
    white-space:normal; 
    line-height:1.1; 
} 
 
.edit-history-button{ 
    color:#fff; 
    background:#6bb7df; 
    box-shadow:0 4px 0 #438db6 
} 
 
.edit-history-button:hover{ 
    box-shadow:0 6px 0 #438db6 
} 
 
.save-history-button{ 
    color:#fff; 
    background:#67c88f; 
    box-shadow:0 4px 0 #469b6b 
} 
 
.save-history-button:hover{ 
    box-shadow:0 6px 0 #469b6b 
} 
 
.delete-history-button{ 
    margin-top:7px; 
    color:#fff; 
    background:#ef7189; 
    box-shadow:0 4px 0 #c64d68; 
} 
 
.delete-history-button:hover{ 
    box-shadow:0 6px 0 #c64d68 
} 
 
.color-cell{ 
    min-width:0; 
    width:100%; 
} 
 
.color-input{ 
    display:block; 
    width:100%; 
    max-width:100%; 
    min-width:0; 
    height:34px; 
    padding:0 7px; 
    border-radius:10px; 
    border:2px solid #cce8f2; 
    background:#fbfeff; 
    color:var(--ink); 
    font-size:11px; 
    outline:none; 
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7); 
    font-weight:800; 
} 
 
.color-input::placeholder{ 
    color:#91a5b4 
} 
 
.color-input:focus{ 
    border-color:#ffc857; 
    box-shadow:0 0 0 3px rgba(255,200,87,.12) 
} 
 
.print-history-area{ 
    margin-top:19px; 
    width:100%; 
    display:flex; 
    flex-direction:column; 
    gap:11px; 
} 
 
.print-history-button{ 
    width:100%; 
    height:59px; 
    border-radius:17px; 
    color:#ffffff; 
    background:#111111; 
    box-shadow: 
        0 7px 0 #000000, 
        0 12px 20px rgba(0,0,0,.22); 
    position:relative; 
    font-size:13px; 
    font-weight:1000; 
} 
 
.print-history-button:hover{ 
    box-shadow: 
        0 9px 0 #000000, 
        0 14px 22px rgba(0,0,0,.28); 
} 
 
.print-history-button:disabled{ 
    opacity:.45; 
    cursor:not-allowed; 
    transform:none!important; 
    filter:grayscale(.35); 
    box-shadow:0 5px 0 #000000!important; 
} 
 
.print-history-button:disabled:hover{ 
    transform:none!important; 
    filter:grayscale(.35); 
    box-shadow:0 5px 0 #000000!important; 
} 
 
.export-excel-button{ 
    width:100%; 
    height:55px; 
    border-radius:17px; 
    color:#ffffff; 
    background:linear-gradient( 
        145deg, 
        #49c77a, 
        #249b58 
    ); 
    box-shadow: 
        0 7px 0 #197541, 
        0 12px 20px rgba(36,155,88,.22); 
    font-size:13px; 
    font-weight:1000; 
} 
 
.export-excel-button:hover{ 
    box-shadow: 
        0 10px 0 #197541, 
        0 16px 24px rgba(36,155,88,.28); 
} 
 
.export-excel-button:disabled{ 
    opacity:.45; 
    cursor:not-allowed; 
    transform:none!important; 
    filter:grayscale(.35); 
    box-shadow:0 5px 0 #197541!important; 
} 
 
.empty-history{ 
    padding:33px!important; 
    text-align:center; 
    color:#93a6b4; 
    font-size:11px; 
    font-weight:800 
} 
 
.footer{ 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    gap:7px; 
    margin-top:14px; 
    padding:10px 14px; 
    border:2px dashed #cfe8f3; 
    border-radius:14px; 
    background:linear-gradient(145deg,#f5fcff,#edf9fd); 
    color:#71889a; 
    font-size:10px; 
    font-weight:800;

                    <tr>

<script> 
 
const inputList = 
    document.getElementById("inputList"); 
 
const result = 
    document.getElementById("result"); 
 
const total = 
    document.getElementById("total"); 
 
const historyBody = 
    document.getElementById("historyBody"); 
 
const dataCount = 
    document.getElementById("dataCount"); 
 
const dataCounter = 
    document.getElementById("dataCounter"); 
 
const exportExcelButton = 
    document.getElementById("exportExcelButton"); 
 
const printHistoryButton = 
    document.getElementById("printHistoryButton"); 
 
const resetButton = 
    document.querySelector(".reset-button"); 
 
const saveButton = 
    document.querySelector(".save-button"); 
 
const clearHistoryButton = 
    document.querySelector(".clear-history"); 
 
let number = 0; 
 
 
/* ========================================================= 
   CEK ANGKA VALID 
   0 / 00 / 000 / 0000 TIDAK VALID 
========================================================= */ 
 
function isValidYardValue(value){ 
 
    if( 
        value === null || 
        value === undefined 
    ){ 
 
        return false; 
 
    } 
 
    const text = 
        String(value).trim(); 
 
    if(text === ""){ 
 
        return false; 
 
    } 
 
    const numberValue = 
        Number(text); 
 
    if( 
        !Number.isFinite(numberValue) 
    ){ 
 
        return false; 
 
    } 
 
    /* 
       Semua angka yang hasilnya 0 dianggap tidak valid. 
       Jadi: 
       0 
       00 
       000 
       0000 
       0.0 
       0.00 
       000.000 
       tidak akan terbaca sebagai data. 
    */ 
 
    if( 
        numberValue <= 0 
    ){ 
 
        return false; 
 
    } 
 
    return true; 
 
} 
 
 
/* ========================================================= 
   UPDATE JUMLAH DATA 
========================================================= */ 
 
function updateDataCounter(){ 
 
    const inputs = 
        inputList.querySelectorAll("input"); 
 
    let count = 0; 
 
    inputs.forEach( 
        input => { 
 
            if( 
                isValidYardValue(input.value) 
            ){ 
 
                count++; 
 
            } 
 
        } 
    ); 
 
    dataCount.textContent = 
        count; 
 
    if(count > 0){ 
 
        dataCounter.classList.add("active"); 
 
    }else{ 
 
        dataCounter.classList.remove("active"); 
 
    } 
 
} 
 
 
/* ========================================================= 
   UPDATE STATUS PRINT 
========================================================= */ 
 
function updatePrintButton(){ 
 
    if(!printHistoryButton){ 
        return; 
    } 
 
    const rows = 
        historyBody.querySelectorAll( 
            "tr:not(#emptyHistory)" 
        ); 
 
    const editingRow = 
        historyBody.querySelector( 
            "tr.editing" 
        ); 
 
    if( 
        rows.length === 0 || 
        editingRow 
    ){ 
 
        printHistoryButton.disabled = true; 
 
    }else{ 
 
        printHistoryButton.disabled = false; 
 
    } 
 
} 
 
 
/* ========================================================= 
   UPDATE STATUS EXPORT EXCEL 
========================================================= */ 
 
function updateExportButton(){ 
 
    if(!exportExcelButton){ 
        return; 
    } 
 
    const rows = 
        historyBody.querySelectorAll( 
            "tr:not(#emptyHistory)" 
        ); 
 
    const editingRow = 
        historyBody.querySelector( 
            "tr.editing" 
        ); 
 
    if( 
        rows.length === 0 || 
        editingRow 
    ){ 
 
        exportExcelButton.disabled = true; 
 
    }else{ 
 
        exportExcelButton.disabled = false; 
 
    } 
 
} 
 
 
/* ========================================================= 
   UPDATE STATUS TOMBOL AKSI 
========================================================= */ 
 
function updateActionButtons(){ 
 
    if(resetButton){ 
 
        const inputs = 
            inputList.querySelectorAll("input"); 
 
        let hasInputData = false; 
 
        inputs.forEach( 
            input => { 
 
                if( 
                    isValidYardValue(input.value) 
                ){ 
 
                    hasInputData = true; 
 
                } 
 
            } 
        ); 
 
        resetButton.disabled = 
            !hasInputData; 
 
    } 
 
    if(saveButton){ 
 
        const inputs = 
            inputList.querySelectorAll("input"); 
 
        let hasInputData = false; 
 
        inputs.forEach( 
            input => { 
 
                if( 
                    isValidYardValue(input.value) 
                ){ 
 
                    hasInputData = true; 
 
                } 
 
            } 
        ); 
 
        saveButton.disabled = 
            !hasInputData; 
 
    } 
 
    if(clearHistoryButton){ 
 
        const rows = 
            historyBody.querySelectorAll( 
                "tr:not(#emptyHistory)" 
            ); 
 
        clearHistoryButton.disabled = 
            rows.length === 0; 
 
    } 
 
} 
 
 
function updateHistoryButtons(){ 
 
    updateActionButtons(); 
 
    updatePrintButton(); 
 
    updateExportButton(); 
 
} 
 
 
/* ========================================================= 
   VALIDASI INPUT YARD 
========================================================= */ 
 
function sanitizeYardInput(input){ 

    let value = input.value; 

    /* 
       Desimal boleh menggunakan titik atau koma. 
       Keduanya dinormalisasi menjadi titik agar 
       perhitungan JavaScript tetap konsisten. 
    */ 
    value = 
        value.replace(/,/g,"."); 

    value = 
        value.replace(/[^0-9.]/g,""); 

    const firstDot = 
        value.indexOf("."); 

    if(firstDot !== -1){ 

        value = 
            value.substring( 
                0, 
                firstDot + 1 
            ) + 
            value 
                .substring(firstDot + 1) 
                .replace(/\./g,""); 

    } 

    input.value = 
        value; 

} 
 
 
/* ========================================================= 
   TAMBAH INPUT 
========================================================= */ 
 
function addInput(focusInput = true){ 
 
    number++; 
 
    const row = 
        document.createElement("div"); 
 
    row.className = 
        "input-row"; 
 
    row.innerHTML = ` 
 
        <div class="number"> 
            ${number} 
        </div> 
 
        <div class="input-wrapper"> 
 
            <input 
                type="text" 
                inputmode="decimal" 
                placeholder="Input Yard" 
                autocomplete="off" 
                onkeydown="return allowYardKey(event)" 
                oninput="handleYardInput(this)" 
            > 
 
            <span class="check"> 
                ✓ 
            </span> 
 
        </div> 
 
        <button 
            type="button" 
            class="delete-input-button" 
            onclick="removeInput(this)" 
            title="Hapus Kolom" 
        > 
            × 
        </button> 
 
    `; 
 
    inputList.appendChild(row); 
 
    updateInputNumbers(); 
 
    const input = 
        row.querySelector("input"); 
 
 
    input.addEventListener( 
        "keydown", 
        function(event){ 
 
            if( 
                event.key === "e" || 
                event.key === "E" || 
                event.key === "+" || 
                event.key === "-" 
            ){ 
 
                event.preventDefault(); 
 
                return false; 
 
            } 
 
            if( 
                event.key === "Enter" 
            ){ 
 
                event.preventDefault(); 
 
                /* 
                   Input 0, 00, 000 dan seterusnya 
                   tidak dianggap sebagai data. 
                */ 
 
                if( 
                    !isValidYardValue(this.value) 
                ){ 
 
                    return; 
 
                } 
 
                const inputs = 
                    inputList.querySelectorAll( 
                        "input" 
                    ); 
 
                const lastInput = 
                    inputs[ 
                        inputs.length - 1 
                    ]; 
 
                if( 
                    this === lastInput 
                ){ 
 
                    addInput(true); 
 
                }else{ 
 
                    const index = 
                        Array 
                            .from(inputs) 
                            .indexOf(this); 
 
                    if( 
                        inputs[index + 1] 
                    ){ 
 
                        inputs[ 
                            index + 1 
                        ].focus(); 
 
                    } 
 
                } 
 
            } 
 
        } 
    ); 
 
 
    input.addEventListener( 
        "input", 
        function(){ 
 
            sanitizeYardInput(this); 
 
            if( 
                isValidYardValue(this.value) 
            ){ 
 
                this.classList.add("valid"); 
 
            }else{ 
 
                this.classList.remove("valid"); 
 
            } 
 
            calculateTotal(); 
 
        } 
    ); 
 
 
    input.addEventListener( 
        "paste", 
        function(){ 
 
            setTimeout( 
                () => { 
 
                    sanitizeYardInput(this); 
 
                    if( 
                        isValidYardValue(this.value) 
                    ){ 
 
                        this.classList.add("valid"); 
 
                    }else{ 
 
                        this.classList.remove("valid"); 
 
                    } 
 
                    calculateTotal(); 
 
                }, 
                0 
            ); 
 
        } 
    ); 
 
 
    if(focusInput){ 
 
        setTimeout( 
            () => input.focus(), 
            50 
        ); 
 
    } 
 
} 
 
 
/* ========================================================= 
   BLOKIR KEYBOARD NON ANGKA 
========================================================= */ 
 
function allowYardKey(event){ 
 
    const allowedKeys = [ 
 
        "Backspace", 
        "Delete", 
        "Tab", 
        "Escape", 
        "Enter", 
        "ArrowLeft", 
        "ArrowRight", 
        "ArrowUp", 
        "ArrowDown", 
        "Home", 
        "End" 
 
    ]; 
 
    if( 
        allowedKeys.includes(event.key) 
    ){ 
 
        return true; 
 
    } 
 
    if( 
        /^[0-9]$/.test(event.key) 
    ){ 
 
        return true; 
 
    } 
 
    if( 
        event.key === "." || 
        event.key === "," 
    ){ 
 
        if( 
            event.target.value.includes(".") || 
            event.target.value.includes(",") 
        ){ 
 
            event.preventDefault(); 
 
            return false; 
 
        } 
 
        return true; 
 
    } 
 
    event.preventDefault(); 
 
    return false; 
 
} 
 
 
/* ========================================================= 
   HANDLE INPUT YARD 
========================================================= */ 
 
function handleYardInput(input){ 
 
    sanitizeYardInput(input); 
 
    if( 
        isValidYardValue(input.value) 
    ){ 
 
        input.classList.add("valid"); 
 
    }else{ 
 
        input.classList.remove("valid"); 
 
    } 
 
    calculateTotal(); 
 
} 
 
 
/* ========================================================= 
   HAPUS INPUT 
========================================================= */ 
 
function removeInput(button){ 
 
    const row = 
        button.closest(".input-row"); 
 
    if(!row){ 
        return; 
    } 
 
    const rows = 
        inputList.querySelectorAll( 
            ".input-row" 
        ); 
 
    if( 
        rows.length === 1 
    ){ 
 
        const input = 
            row.querySelector("input"); 
 
        if(input){ 
 
            input.value = ""; 
 
            input.classList.remove( 
                "valid" 
            ); 
 
            input.focus(); 
 
        } 
 
        calculateTotal(); 
 
        return; 
 
    } 
 
    row.remove(); 
 
    updateInputNumbers(); 
 
    calculateTotal(); 
 
} 
 
 
/* ========================================================= 
   UPDATE NOMOR INPUT 
========================================================= */ 
 
function updateInputNumbers(){ 
 
    const rows = 
        inputList.querySelectorAll( 
            ".input-row" 
        ); 
 
    rows.forEach( 
        (row,index) => { 
 
            const numberElement = 
                row.querySelector(

                );

                numberElement.textContent = 
                    index + 1; 
 
            } 
 
            const deleteButton = 
                row.querySelector( 
                    ".delete-input-button" 
                ); 
 
            if(deleteButton){ 
 
                deleteButton.disabled = 
                    rows.length === 1; 
 
            } 
 
        } 
    ); 
 
} 
 
 
/* ========================================================= 
   HITUNG TOTAL 
========================================================= */ 
 
function calculateTotal(){ 
 
    const inputs = 
        inputList.querySelectorAll( 
            "input" 
        ); 
 
    let sum = 0; 
 
    let filled = 0; 
 
    inputs.forEach( 
        input => { 
 
            const value = 
                parseFloat( 
                    input.value 
                ); 
 
            /* 
               PENTING: 
               0 tidak dihitung. 
            */ 
 
            if( 
                Number.isFinite(value) && 
                value > 0 
            ){ 
 
                sum += value; 
 
                filled++; 
 
            } 
 
        } 
    ); 
 
    total.textContent = 
        formatNumber(sum); 
 
    if( 
        filled > 0 
    ){ 
 
        result.classList.add("show"); 
 
    }else{ 
 
        result.classList.remove("show"); 
 
    } 
 
    updateDataCounter(); 
 
    updateActionButtons(); 
 
}

/* ========================================================= 
   HITUNG TOTAL YARD 
========================================================= */ 
 
function calculateYardTotal(values){ 
 
    let totalValue = 0; 
 
    values.forEach( 
        value => { 
 
            const numberValue = 
                Number(value); 
 
            if( 
                Number.isFinite(numberValue) && 
                numberValue > 0 
            ){ 
 
                totalValue += 
                    numberValue; 
 
            } 
 
        } 
    ); 
 
    return totalValue; 
 
} 
 
 
/* ========================================================= 
   FORMAT YARD 
========================================================= */ 
 
function formatYardDisplay(values){ 
 
    return "(" + 
        values 
            .map( 
                value => 
                    formatNumber(value) 
            ) 
            .join(", ") + 
        ")"; 
 
}

                "ArrowRight", 
                "ArrowUp", 
                "ArrowDown", 
                "Home", 
                "End", 
                " " 
            ]; 
 
            if(

            ){

/* ========================================================= 
   PARSE YARD EDIT 
   NILAI 0 TIDAK DIBACA 
========================================================= */ 
 
function parseYardText(text){ 

    if( 
        text === null || 
        text === undefined 
    ){ 

        return []; 

    } 

    const cleanText = 
        String(text) 
            .replace(/[()]/g,"") 
            .trim(); 

    if(!cleanText){ 

        return []; 

    } 

    return cleanText 
        .split(/[\s;]+/) 
        .map( 
            item => 
                parseFloat( 
                    item 
                        .trim() 
                        .replace(",", ".") 
                ) 
        ) 
        .filter( 
            value => 
                Number.isFinite(value) && 
                value > 0 
        ); 

} 


/* ========================================================= 
   ESCAPE ATTRIBUTE 
========================================================= */ 
 
function escapeHtmlAttribute(value){ 
 
    return String(value) 
        .replace(/&/g,"&amp;") 
        .replace(/"/g,"&quot;") 
        .replace(/'/g,"&#039;") 
        .replace(/</g,"&lt;") 
        .replace(/>/g,"&gt;"); 
 
} 
 
 
/* ========================================================= 
   FORMAT ANGKA 
========================================================= */ 
 
function formatNumber(number){ 
 
    if( 
        Number.isInteger(number) 
    ){ 
 
        return number.toLocaleString( 
            "en-US" 
        ); 
 
    } 
 
    return Number(number) 
        .toLocaleString( 
            "en-US", 
            { 
                maximumFractionDigits:10 
            } 
        ); 
 
}

   PRINT HISTORY 
========================================================= */ 
 
function printHistory(){ 
 
    const editingRow = 
        historyBody.querySelector( 
            "tr.editing" 
        ); 
 
    if(editingRow){ 
 
        alert( 
            "Selesaikan edit data terlebih dahulu" 
        ); 
 
        return; 
 
    } 
 
    const rows = 
        historyBody.querySelectorAll( 
            "tr:not(#emptyHistory)" 
        ); 
 
    if(rows.length === 0){ 
 
        return; 
 
    } 
 
    window.print(); 
 
} 
 
 
/* ========================================================= 
   EXPORT HISTORY KE EXCEL 
========================================================= */ 
 
function exportHistoryToExcel(){ 
 
    const editingRow = 
        historyBody.querySelector( 
            "tr.editing" 
        ); 
 
    if(editingRow){ 
 
        alert( 
            "Selesaikan edit data terlebih dahulu sebelum export Excel." 
        ); 
 
        return; 
 
    } 
 
    const rows = 
        historyBody.querySelectorAll( 
            "tr:not(#emptyHistory)" 
        ); 
 
    if(rows.length === 0){ 
 
        alert( 
            "Belum ada data history untuk diekspor." 
        ); 
 
        return; 
 
    } 
 
 
    let excelRows = ""; 
 
    rows.forEach( 
        (row,index) => { 
 
            const no = 
                index + 1; 
 
            const yardElement = 
                row.querySelector( 
                    ".numbers-cell" 
                ); 
 
            const pcsElement = 
                row.querySelector( 
                    ".pcs-cell" 
                ); 
 
            const totalElement = 
                row.querySelector( 
                    ".total-cell" 
                ); 
 
            const colorInput = 
                row.querySelector( 
                    ".color-input" 
                ); 
 
 
            const yard = 
                yardElement 
                    ? yardElement.textContent.trim() 
                    : ""; 
 
            const pcs = 
                pcsElement 
                    ? pcsElement.textContent.trim() 
                    : ""; 
 
            const totalYard = 
                totalElement 
                    ? totalElement.textContent.trim() 
                    : ""; 
 
            const warna = 
                colorInput 
                    ? colorInput.value.trim() 
                    : ""; 
 
 
            excelRows += ` 
 
                <tr> 
 
                    <td style="text-align:center;"> 
                        ${escapeExcel(no)} 
                    </td> 
 
                    <td style="text-align:center;"> 
                        ${escapeExcel(yard)} 
                    </td> 
 
                    <td style="text-align:center;"> 
                        ${escapeExcel(pcs)} 
                    </td> 
 
                    <td style="text-align:center;"> 
                        ${escapeExcel(totalYard)} 
                    </td> 
 
                    <td style="text-align:center;"> 
                        ${escapeExcel(warna)} 
                    </td> 
 
                </tr> 
 
            `; 
 
        } 
    ); 
 
 
    const excelHTML = ` 
 
        <html> 
 
        <head> 
 
            <meta charset="UTF-8"> 
 
            <style> 
 
                body{ 
                    font-family:Arial,Helvetica,sans-serif; 
                } 
 
                h2{ 
                    text-align:center; 
                    font-size:18px; 
                    margin-bottom:5px; 
                } 
 
                p{ 
                    text-align:center; 
                    font-size:11px; 
                    color:#555; 
                    margin-bottom:18px; 
                } 
 
                table{ 
                    border-collapse:collapse; 
                    width:100%; 
                } 
 
                th{ 
                    background:#e9e9e9; 
                    color:#111; 
                    border:1px solid #444; 
                    padding:8px; 
                    text-align:center; 
                    font-weight:bold; 
                } 
 
                td{ 
                    border:1px solid #444; 
                    padding:8px; 
                    color:#111; 
                    text-align:center; 
                    vertical-align:middle; 
                } 
 
            </style> 
 
        </head> 
 
        <body> 
 
            <h2> 
                PT SION NIAGA PERKASA 
            </h2> 
 
            <p> 
                RIWAYAT INPUT YARD 
            </p> 
 
            <table> 
 
                <thead> 
 
                    <tr> 
 
                        <th> 
                            No 
                        </th> 
 
                        <th> 
                            YARD 
                        </th> 
 
                        <th> 
                            Total PCS 
                        </th> 
 
                        <th> 
                            Total Yard 
                        </th> 
 
                        <th> 
                            Warna 
                        </th> 
 
                    </tr> 
 
                </thead> 
 
                <tbody> 
 
                    ${excelRows} 
 
                </tbody> 
 
            </table> 
 
        </body> 
 
        </html> 
 
    `; 
 
 
    const blob = 
        new Blob( 
            [ 
                "\ufeff", 
                excelHTML 
            ], 
            { 
                type: 
                    "application/vnd.ms-excel;charset=utf-8;" 
            } 
        ); 
 
 
    const url = 
        URL.createObjectURL( 
            blob 
        ); 
 
 
    const link = 
        document.createElement("a"); 
 
    link.href = 
        url; 
 
    const now = 
        new Date(); 
 
    const year = 
        now.getFullYear(); 
 
    const month = 
        String( 
            now.getMonth() + 1 
        ).padStart(2,"0"); 
 
    const day = 
        String( 
            now.getDate() 
        ).padStart(2,"0"); 
 
    const hours = 
        String( 
            now.getHours() 
        ).padStart(2,"0"); 
 
    const minutes = 
        String( 
            now.getMinutes() 
        ).padStart(2,"0"); 
 
    const seconds = 
        String( 
            now.getSeconds() 
        ).padStart(2,"0"); 
 
 
    link.download = 
        `History_Yard_${year}-${month}-${day}_${hours}-${minutes}-${seconds}.xls`; 
 
 
    document.body.appendChild(link); 
 
    link.click(); 
 
    document.body.removeChild(link); 
 
 
    setTimeout( 
        () => { 
 
            URL.revokeObjectURL( 
                url 
            ); 
 
        }, 
        1000 
    ); 
 
} 
 
 
/* ========================================================= 
   ESCAPE DATA EXCEL 
========================================================= */ 
 
function escapeExcel(value){ 
 
    return String(value ?? "") 
        .replace(/&/g,"&amp;") 
        .replace(/</g,"&lt;") 
        .replace(/>/g,"&gt;") 
        .replace(/"/g,"&quot;") 
        .replace(/'/g,"&#039;"); 
 
}

addInput(false); 
 
updateDataCounter(); 
 
updateActionButtons(); 
 
updateHistoryButtons(); 
 
</script>
